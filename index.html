<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pmath</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-width column with a bottom tab bar — practice, timed test, textbook, calculators, settings. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#141a2a; --muted:#5f6a82; --line:#d6dbe6;
  --accent:#2747d6; --accent-ink:#ffffff; --accent-soft:#e4e9fb;
  --good:#1c8a55; --good-soft:#e0f3e9; --warn:#a86a00; --warn-soft:#fbeed0; --bad:#c93a3a; --bad-soft:#fae6e6;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-q:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --surface:#181e30; --ink:#e9ecf5; --muted:#98a2bb; --line:#2a3350;
    --accent:#7f96ff; --accent-ink:#0f1320; --accent-soft:#222b4d;
    --good:#4cc38a; --good-soft:#163527; --warn:#f0b84a; --warn-soft:#3a2e12; --bad:#f07171; --bad-soft:#3b1d22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#181e30; --ink:#e9ecf5; --muted:#98a2bb; --line:#2a3350;
  --accent:#7f96ff; --accent-ink:#0f1320; --accent-soft:#222b4d;
  --good:#4cc38a; --good-soft:#163527; --warn:#f0b84a; --warn-soft:#3a2e12; --bad:#f07171; --bad-soft:#3b1d22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:14px 16px 84px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:0}
p{margin:0}
.view{display:flex;flex-direction:column;gap:14px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font-size:13.5px;font-weight:500;padding:7px 4px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.meta .tags,.metaR{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.lv{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tm{font-variant-numeric:tabular-nums;font-weight:700;padding:3px 9px;border-radius:999px;font-size:13px}
.tm.ok{background:var(--good-soft);color:var(--good)}
.tm.warn{background:var(--warn-soft);color:var(--warn)}
.tm.over{background:var(--bad-soft);color:var(--bad)}
.mini{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.q{font-family:var(--font-q);font-size:18.5px;line-height:1.5;text-wrap:pretty}
.q .eq{display:block;text-align:center;margin:8px 0;font-size:19px}
.q table{border-collapse:collapse;margin:10px auto;font-family:var(--font-ui);font-size:14px;font-variant-numeric:tabular-nums}
.q th,.q td{border:1px solid var(--line);padding:5px 10px;text-align:center}
.q th{font-weight:600;color:var(--muted)}
.tw{overflow-x:auto}
.qwrap{display:flex;flex-direction:column;gap:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--font-q);font-size:17.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt i{font-family:var(--font-ui);font-style:normal;font-size:12.5px;font-weight:700;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok i{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no i{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.grid-in{display:flex;flex-direction:column;gap:6px}
.grid-in input,.search{font-family:var(--font-q);font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.search{font-family:var(--font-ui);font-size:15px;background:var(--surface)}
.grid-in span{font-size:12.5px;color:var(--muted)}
.btn{font-weight:600;font-size:15px;padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.fb{border-radius:12px;padding:12px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.note{background:var(--accent-soft)}
.fb b{font-size:15px} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.row span:last-of-type{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--accent);border-radius:3px}
.link{font-size:13.5px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;align-self:flex-start;text-align:left}
.muted{color:var(--muted);font-size:13.5px}
[hidden]{display:none!important}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,calc((100% - 520px)/2)) calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;border-radius:10px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* test */
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.thead b{font-size:14px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{height:36px;border-radius:8px;border:1px dashed var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.pal button.ans{border-style:solid;background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.pal button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.pal button.cur{border:2px solid var(--accent)}
.score{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:15px;color:var(--muted);font-weight:500}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary small{font-weight:500;color:var(--muted);font-size:12.5px}
details>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.st{font-weight:700;flex:none}.st.ok{color:var(--good)}.st.no{color:var(--bad)}.st.skip{color:var(--muted)}
.hist{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
/* book */
.dom{display:flex;flex-direction:column;gap:8px}
.rule{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rule>button{width:100%;text-align:left;background:var(--bg);border:0;padding:10px 12px;font-family:var(--font-q);font-size:16.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rule>button::after{content:"?";font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:18px;height:18px;flex:none;display:grid;place-items:center}
.rule.open>button::after{content:"–"}
.rule .ex{padding:10px 12px;display:none;flex-direction:column;gap:8px;font-size:14.5px}
.rule.open .ex{display:flex}
.rule .ex code{font-family:var(--font-q);font-size:15.5px;background:var(--accent-soft);padding:6px 10px;border-radius:8px;display:block}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.fig{width:100%;max-width:300px;height:auto;align-self:center}
.fig text{font-family:var(--font-ui);font-size:11px;fill:var(--muted)}
.fig .ta{fill:var(--accent);font-weight:600}
.fig .fl{stroke:var(--muted);stroke-width:1;fill:none;opacity:.6}
.fig .fs{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round}
.fig .fa{stroke:var(--accent);stroke-width:2.2;fill:none}
.fig .fd{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4;fill:none}
.fig .dot{fill:var(--accent)} .fig .dot2{fill:var(--ink);opacity:.7}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px}
.gl b{font-family:var(--font-q);font-weight:500;font-size:15px}
/* settings */
.pick{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick b{font-size:15.5px}
.pick span{font-size:13px;color:var(--muted)}
/* calculator sheet + tools */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.sheet .bar2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.frame{flex:1;min-height:0;display:flex}
.frame iframe,.toolbox iframe{border:0;width:100%;height:100%;flex:1;min-width:0;background:#fff}
.toolbox{height:calc(100dvh - 210px);min-height:380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;background:var(--surface)}
.ph{padding:20px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:flex-start}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:30;display:grid;place-items:center;padding:20px}
.modal .card{max-width:360px;width:100%}
@media (prefers-reduced-motion:no-preference){.bar div{transition:width .3s}}

.btn.sm{padding:9px 12px;font-size:14px;width:auto;align-self:flex-start}
.rule.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#bookBack{position:sticky;top:8px;z-index:3}

.plot{display:block;width:100%;max-width:290px;height:auto;margin:4px auto 10px;background:var(--surface)}
.plot.wide{max-width:340px}
.plot text{font-family:var(--font-ui);font-size:9.5px;fill:var(--muted)}
.plot .gt{font-size:11px;font-style:italic;fill:var(--ink)}
.plot .gg{stroke:var(--line);stroke-width:1}
.plot .ga{stroke:var(--ink);stroke-width:1.4}
.plot .gc{stroke:var(--accent);stroke-width:2.2;fill:none}
.plot .gc2{stroke:var(--ink);stroke-width:2.2;fill:none}
.plot .gdash{stroke-dasharray:6 5}
.plot .gp{fill:var(--ink)}
.plot .gb{fill:var(--accent)}
.plot .gsh{fill:var(--accent);opacity:.18}
.q .fig.qf{display:block;max-width:290px;margin:4px auto 2px}
.q .fig.qf text{font-size:13px;fill:var(--ink)}
.q .cap{display:block;text-align:center;font-family:var(--font-ui);font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <header><h1>Pmath</h1><button class="chip" id="testChip" title="Сменить тип теста"></button></header>

  <section class="view" id="v-practice">
    <div class="strip">
      <div class="tile"><b id="sTotal">0</b><small>решено</small></div>
      <div class="tile"><b id="sAcc">—</b><small>точность</small></div>
      <div class="tile"><b id="sStreak">0</b><small>серия подряд</small></div>
    </div>
    <div class="group"><h3>Секция</h3><div class="chips" id="secs"></div></div>
    <div class="group"><h3>Сложность</h3><div class="seg" id="lvls"></div></div>
    <div class="card">
      <div class="meta"><div class="tags"><span class="tag" id="tSec"></span><span class="tag lv" id="tLvl"></span></div>
        <div class="metaR"><button class="mini" data-calc>Desmos</button><span class="tm ok" id="timer">0:00</span></div></div>
      <div class="qwrap" id="pQ"></div>
      <div class="fb" id="fb" hidden></div>
      <button class="btn" id="go" disabled>Проверить</button>
    </div>
    <div class="card"><h3>Точность по секциям</h3><div class="rows" id="rows"></div></div>
  </section>

  <section class="view" id="v-test" hidden></section>
  <section class="view" id="v-book" hidden></section>
  <section class="view" id="v-tools" hidden>
    <div class="seg" id="toolSeg"></div>
    <div class="toolbox" id="toolBox"></div>
    <p class="muted" id="toolNote"></p>
  </section>
  <section class="view" id="v-settings" hidden></section>
</div>

<nav class="tabs" id="tabs">
  <button data-v="practice" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>Тренировка</button>
  <button data-v="test"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Тест</button>
  <button data-v="book"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1V5z"/><path d="M12 6v14"/></svg>Учебник</button>
  <button data-v="tools"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>Калькулятор</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
</nav>

<div class="sheet" id="calc" hidden>
  <div class="bar2"><b>Desmos</b><button class="mini" id="calcClose">Закрыть</button></div>
  <div class="frame" id="calcFrame"></div>
</div>
<div class="modal" id="dlg" hidden><div class="card"><p id="dlgText"></p><div class="btnrow"><button class="btn ghost" id="dlgNo">Отмена</button><button class="btn" id="dlgYes">Да</button></div></div></div>

<script>
/*GEN-START*/
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=(a,b)=>{let v;do{v=ri(a,b);}while(v===0);return v;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?`${n}`:`${n}/${d}`;};
const m=n=>n<0?`−${-n}`:`${n}`;                 // number with a real minus
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;            // signed term
const eq=s=>`<span class="eq">${s}</span>`;
const sq='<sup>2</sup>';
function poly(a,b,c){
  let s=(a===1?'':a===-1?'−':m(a))+'x'+sq;
  if(b)s+=` ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}x`;
  if(c)s+=` ${sg(c)}`;
  return s;
}
function mc(correct,cands,fmt){
  fmt=fmt||(x=>typeof x==='number'?m(x):x);
  const c=String(fmt(correct)),set=[];
  for(const x of cands){const s=String(fmt(x));if(s!==c&&!set.includes(s))set.push(s);}
  let k=1;
  while(set.length<3&&typeof correct==='number'&&k<50){const s=String(fmt(correct+k));if(s!==c&&!set.includes(s))set.push(s);k=k>0?-k:-k+1;}
  const ch=shuffle([c,...shuffle(set).slice(0,3)]);
  return {choices:ch,answer:ch.indexOf(c)};
}
const money=v=>'$'+(Number.isInteger(v)?v:v.toFixed(2));

const POOL=[];
function add(sec,lvl,tier,topic,fn,rule){POOL.push({sec,lvl,tier,topic,fn,rule});}

/* ---------- Algebra ---------- */
add('alg',1,0,'lin1',()=>{const a=ri(2,9),x=ri(2,12),b=ri(1,20),c=a*x+b;
  return {q:`If ${a}x + ${b} = ${c}, what is the value of x?`,...mc(x,[x+1,x-1,c-b,x+2]),
    expl:`Вычитаем ${b} из обеих частей: ${a}x = ${c-b}. Делим на ${a}: x = ${x}.`};});
add('alg',1,0,'linmodel',()=>{const fee=ri(2,9)*5;let rate;do{rate=ri(2,9)*5;}while(rate===fee);
  const ctx=pick([['A gym charges a one-time sign-up fee of','per month','months'],['A bike shop charges a flat rental fee of','per hour','hours'],['A plumber charges a service fee of','per hour of work','hours']]);
  return {q:`${ctx[0]} $${fee} plus $${rate} ${ctx[1]}. Which equation gives the total cost C, in dollars, for m ${ctx[2]}?`,
    ...mc(`C = ${rate}m + ${fee}`,[`C = ${fee}m + ${rate}`,`C = ${fee+rate}m`,`C = ${rate}(m + ${fee})`]),
    expl:`Разовая плата $${fee} — это константа, а $${rate} умножается на количество m. Получаем C = ${rate}m + ${fee}.`};});
add('alg',1,0,'slope',()=>{const x1=ri(-5,3),y1=ri(-6,6),dx=ri(1,4),k=nz(-4,4),x2=x1+dx,y2=y1+k*dx;
  return {q:`A line in the xy-plane passes through the points (${m(x1)}, ${m(y1)}) and (${m(x2)}, ${m(y2)}). What is the slope of the line?`,answer:k,d:[-k,[dx,k*dx],k*dx,k+1],
    expl:`Наклон = (y₂ − y₁)/(x₂ − x₁) = (${m(y2)} − (${m(y1)}))/(${m(x2)} − (${m(x1)})) = ${m(k*dx)}/${dx} = ${m(k)}.`};});

add('alg',2,0,'systems',()=>{const x=ri(1,9),y=ri(1,9),a=ri(2,5),b=ri(2,5);
  return {q:`${eq(`${a}x + y = ${a*x+y}`)}${eq(`x + ${b}y = ${x+b*y}`)}The solution to the given system of equations is (x, y). What is the value of x + y?`,answer:x+y,d:[x,y,x*y,a*x+y],
    expl:`Из первого уравнения y = ${a*x+y} − ${a}x. Подставляем во второе и получаем x = ${x}, затем y = ${y}. Сумма: ${x+y}.`};});
add('alg',2,0,'lin1',()=>{const a=ri(2,6),x=ri(2,9),b=ri(1,15),k=pick([2,3]),n=ri(1,9),c=a*x+b,ans=k*a*x-n;
  return {q:`If ${a}x + ${b} = ${c}, what is the value of ${k*a}x − ${n}?`,...mc(ans,[a*x-n,x,k*a*x+n,k*c-n]),
    expl:`Из уравнения ${a}x = ${c-b}. Тогда ${k*a}x = ${k} · ${c-b} = ${k*(c-b)}, и ${k*a}x − ${n} = ${ans}. Находить сам x не обязательно.`};});
add('alg',2,0,'ineq',()=>{const p=ri(3,12),f=ri(5,20),n=ri(4,15),r=ri(1,p-1),B=f+p*n+r;const who=pick(['Mia','Daniel','Aisha','Leo']);
  return {q:`${who} has $${B} to spend at a fair. Admission costs $${f}, and each ride ticket costs $${p}. What is the maximum number of ride tickets ${who} can buy?`,answer:n,d:[n+1,Math.floor(B/p),Math.floor((B+f)/p),n-1],
    expl:`Неравенство: ${f} + ${p}t ≤ ${B}, то есть ${p}t ≤ ${B-f}, t ≤ ${((B-f)/p).toFixed(2)}. Билетов целое число, поэтому максимум ${n}.`};});
add('alg',2,0,'slope',()=>{const k=nz(-3,3),b=ri(-8,8),x1=ri(1,4),x2=x1+ri(1,3);
  return {q:`A line passes through the points (${x1}, ${m(k*x1+b)}) and (${x2}, ${m(k*x2+b)}) and crosses the y-axis at the point (0, b). What is the value of b?`,answer:b,d:[k,k*x1+b,-b,x1],
    expl:`Наклон = (${m(k*x2+b)} − (${m(k*x1+b)}))/(${x2} − ${x1}) = ${m(k)}. Подставляем точку: ${m(k*x1+b)} = ${m(k)} · ${x1} + b, откуда b = ${m(b)}.`};});

add('alg',3,0,'systems',()=>{const a=ri(2,5),b=ri(2,6),k=pick([2,3,4]),c=ri(1,9),d=k*c+ri(1,5);
  return {q:`${eq(`${a}x + ${b}y = ${c}`)}${eq(`${k*a}x + py = ${d}`)}In the given system of equations, p is a constant. If the system has no solution, what is the value of p?`,answer:k*b,d:[b,k*a,k,k*c],
    expl:`Решений нет, когда прямые параллельны: коэффициенты при x и y пропорциональны, а свободные члены — нет. ${k*a}/${a} = ${k}, значит p = ${k} · ${b} = ${k*b} (при этом ${d} ≠ ${k} · ${c}).`};});
add('alg',3,0,'lin1',()=>{const a=ri(2,6),p=ri(2,7),q=ri(1,9);
  return {q:`${eq(`k(x + ${p}) − ${q} = ${a}x + c`)}In the given equation, k and c are constants. If the equation has infinitely many solutions, what is the value of c?`,answer:a*p-q,d:[a*p+q,a*p,p-q,-q],
    expl:`Бесконечно много решений — обе части совпадают тождественно. Слева kx + ${p}k − ${q}. Значит k = ${a}, а c = ${p} · ${a} − ${q} = ${a*p-q}.`};});
add('alg',3,0,'systems',()=>{const A=ri(8,15),C=A-ri(2,5),na=ri(20,60),nc=ri(20,60),n=na+nc,R=A*na+C*nc;
  return {q:`A theater sold ${n} tickets for a show. Adult tickets cost $${A} each and student tickets cost $${C} each. The total revenue from ticket sales was $${R}. How many adult tickets were sold?`,answer:na,d:[nc,Math.round(R/A),Math.round(R/(A+C)),n],
    expl:`Система: a + s = ${n} и ${A}a + ${C}s = ${R}. Подставляем s = ${n} − a: ${A}a + ${C}(${n} − a) = ${R}, откуда ${A-C}a = ${R-C*n}, a = ${na}.`};});

/* ---------- Advanced Math ---------- */
add('adv',1,0,'func',()=>{const a=ri(1,3),b=nz(-5,5),c=ri(-6,6),k=nz(-3,4),ans=a*k*k+b*k+c;
  return {q:`The function f is defined by ${eq(`f(x) = ${poly(a,b,c)}`)}What is the value of f(${m(k)})?`,...mc(ans,[a*k*k-b*k+c,a*k*2+b*k+c,-a*k*k+b*k+c,ans+ri(1,3)]),
    expl:`Подставляем x = ${m(k)}: ${a} · ${k*k} ${sg(b*k)} ${c?sg(c):''} = ${m(ans)}. Следи за знаком при возведении в квадрат.`};});
add('adv',1,0,'poly',()=>{const p=nz(-7,7),q=nz(-7,7);
  return {q:`Which expression is equivalent to (x ${sg(p)})(x ${sg(q)})?`,
    ...mc(poly(1,p+q,p*q),[poly(1,p*q,p+q),poly(1,p-q,p*q),poly(1,p+q,-p*q),poly(1,-(p+q),p*q),poly(1,p+q,p+q)]),
    expl:`Раскрываем скобки: x · x + (${m(q)})x + (${m(p)})x + (${m(p)})(${m(q)}) = ${poly(1,p+q,p*q)}.`};});
add('adv',1,0,'exp',()=>{const a=ri(2,6),b=ri(2,6),t=ri(0,1);
  return t?{q:`If x<sup>${a}</sup> · x<sup>${b}</sup> = x<sup>n</sup> for all values of x, what is the value of n?`,answer:a+b,d:[a*b,Math.abs(a-b)||1,a+b+1],expl:`При умножении степеней с одинаковым основанием показатели складываются: ${a} + ${b} = ${a+b}.`}
          :{q:`If (x<sup>${a}</sup>)<sup>${b}</sup> = x<sup>n</sup> for all values of x, what is the value of n?`,answer:a*b,rule:1,d:[a+b,a*b+a,a*b-b],expl:`При возведении степени в степень показатели перемножаются: ${a} · ${b} = ${a*b}.`};});

add('adv',2,0,'quad',()=>{const r1=ri(1,9),r2=-ri(1,9);
  return {q:`What is the positive solution to the equation ${eq(`${poly(1,-(r1+r2),r1*r2)} = 0`)}`,answer:r1,d:[-r2,Math.abs(r1+r2),-r1*r2,r1+1],
    expl:`Раскладываем на множители: (x − ${r1})(x + ${-r2}) = 0. Корни: ${r1} и ${m(r2)}. Положительный — ${r1}.`};});
add('adv',2,1,'quad',()=>{let r1,r2;do{r1=nz(-8,8);r2=nz(-8,8);}while(r1===r2);const s=r1+r2;
  return {q:`What is the sum of the solutions to the equation ${eq(`${poly(1,-s,r1*r2)} = 0`)}`,...mc(s,[-s,r1*r2,-r1*r2,r1-r2]),
    expl:`По теореме Виета сумма корней x${sq} + bx + c = 0 равна −b. Здесь b = ${m(-s)}, сумма = ${m(s)} (корни ${m(r1)} и ${m(r2)}).`};});
add('adv',2,0,'expfn',()=>{const a=pick([50,100,200,300,500]),r=pick([2,3]),t=ri(2,4),ans=a*r**t;
  return {q:`The number of bacteria in a culture is modeled by ${eq(`P(t) = ${a}(${r})<sup>t</sup>`)}where t is the number of hours since the start of the experiment. According to the model, how many bacteria are there after ${t} hours?`,
    ...mc(ans,[a*r*t,a*r**(t-1),a*r**(t+1),(a*r)*(t+1)],x=>x.toLocaleString('en-US')),
    expl:`Подставляем t = ${t}: ${a} · ${r}^${t} = ${a} · ${r**t} = ${ans}. Сначала степень, потом умножение.`};});
add('adv',2,0,'radical',()=>{const b=ri(3,9),a=ri(1,20);
  return {q:`What value of x satisfies the equation ${eq(`√(x + ${a}) = ${b}`)}`,answer:b*b-a,d:[b-a,b*b+a,2*b-a,b*b],
    expl:`Возводим обе части в квадрат: x + ${a} = ${b*b}, откуда x = ${m(b*b-a)}.`};});

add('adv',3,0,'vertex',()=>{const h=nz(-6,6),k=ri(-9,9);
  return {q:`The function f is defined by ${eq(`f(x) = ${poly(1,-2*h,h*h+k)}`)}What is the minimum value of f(x)?`,answer:k,d:[h,-h,h*h+k,-k],
    expl:`Выделяем полный квадрат: f(x) = (x ${sg(-h)})${sq} ${k?sg(k):''}. Квадрат не меньше нуля, поэтому минимум равен ${m(k)} (при x = ${m(h)}).`};});
add('adv',3,1,'quad',()=>{const n=ri(2,9);
  return {q:`${eq(`x${sq} − kx + ${n*n} = 0`)}In the given equation, k is a positive constant. If the equation has exactly one real solution, what is the value of k?`,answer:2*n,d:[n,n*n,4*n,4*n*n],
    expl:`Один корень — дискриминант равен нулю: k${sq} − 4 · ${n*n} = 0, k${sq} = ${4*n*n}, k = ${2*n} (берём положительное).`};});
add('adv',3,1,'radical',()=>{const a=ri(2,8);let k;do{k=ri(a+3,22);}while(k===2*a);
  return {q:`${eq(`(x${sq} − ${a*a}) / (x − ${a}) = ${k}`)}If x ≠ ${a}, what value of x satisfies the given equation?`,answer:k-a,d:[k+a,k,k*a,a],
    expl:`Числитель — разность квадратов: (x − ${a})(x + ${a}). Сокращаем на (x − ${a}): x + ${a} = ${k}, x = ${k-a}.`};});
add('adv',3,1,'expfn',()=>{const a=ri(2,6),b=pick([2,3]),f2=a*b*b,ans=a*b**3;
  return {q:`The function f is defined by f(x) = a · b<sup>x</sup>, where a and b are positive constants. If f(0) = ${a} and f(2) = ${f2}, what is the value of f(3)?`,
    ...mc(ans,[f2+(f2-a)/2,a*b**4,a*b*3,f2+a,f2*3]),
    expl:`f(0) = a = ${a}. f(2) = ${a}b${sq} = ${f2}, значит b${sq} = ${b*b}, b = ${b}. Тогда f(3) = ${a} · ${b**3} = ${ans}. Рост не линейный, а в ${b} раза за шаг.`};});

/* ---------- Problem-Solving and Data Analysis ---------- */
add('psda',1,0,'percent',()=>{const price=pick([40,60,80,120,160,200,240]),p=pick([10,15,20,25,30,40]),ans=price*(100-p)/100;
  const item=pick(['jacket','backpack','pair of headphones','calculator']);
  return {q:`A ${item} originally priced at $${price} is on sale for ${p}% off. What is the sale price?`,...mc(ans,[price-p,price*p/100,price*(100+p)/100,ans+5],money),
    expl:`Скидка: ${p}% от ${price} = ${money(price*p/100)}. Цена со скидкой: ${price} − ${price*p/100} = ${money(ans)}.`};});
add('psda',1,0,'stats',()=>{const mean=ri(10,40);const d=[ri(-8,8),ri(-8,8),ri(-8,8),ri(-8,8)];d.push(-d.reduce((s,v)=>s+v,0));const v=shuffle(d.map(x=>mean+x));
  return {q:`What is the mean of the data set below?${eq(v.join(', '))}`,answer:mean,d:[v.slice().sort((p,q)=>p-q)[2],Math.max(...v)-Math.min(...v),mean*5,mean+1],
    expl:`Сумма: ${v.join(' + ')} = ${mean*5}. Делим на 5: ${mean}.`};});
add('psda',1,0,'ratio',()=>{const s=pick([40,45,50,55,60,65]),h=ri(2,4),t=ri(5,8);
  return {q:`A train travels ${s*h} miles in ${h} hours at a constant speed. At this rate, how many miles will the train travel in ${t} hours?`,...mc(s*t,[s*h+t,s*(t-1),s*(t+1),s*h*2]),
    expl:`Скорость: ${s*h} / ${h} = ${s} миль в час. За ${t} часов: ${s} · ${t} = ${s*t}.`};});

add('psda',2,0,'percent',()=>{const a=pick([20,40,60,80,120,200,240,300]),p=pick([5,10,15,20,25,30,40,60]),b=a+a*p/100;
  return {q:`The price of a monthly bus pass increased from $${a} to $${b}. What is the percent increase in the price?`,...mc(p,[b-a,Math.round((b-a)/b*100),p+5,p+10],x=>x+'%'),
    expl:`Рост: ${b} − ${a} = ${b-a}. Делим на исходную цену: ${b-a} / ${a} = ${p/100}, то есть ${p}%. Делить нужно на старое значение, не на новое.`};});
add('psda',2,0,'stats',()=>{const v=Array.from({length:7},()=>ri(10,40)),s=v.slice().sort((x,y)=>x-y);
  return {q:`The number of points a player scored in each of 7 games is shown.${eq(v.join(', '))}What is the median number of points?`,answer:s[3],d:[v[3],Math.round(v.reduce((p,q)=>p+q,0)/7),s[2],s[4]],
    expl:`Упорядочиваем: ${s.join(', ')}. Медиана — четвёртое значение из семи: ${s[3]}.`};});
add('psda',2,0,'prob',()=>{const a=ri(8,40),b=ri(8,40),c=ri(8,40),d=ri(8,40),T=a+b+c+d;
  return {q:`<div class="tw"><table><tr><th></th><th>Bus</th><th>Car</th><th>Total</th></tr><tr><th>Grade 9</th><td>${a}</td><td>${b}</td><td>${a+b}</td></tr><tr><th>Grade 10</th><td>${c}</td><td>${d}</td><td>${c+d}</td></tr><tr><th>Total</th><td>${a+c}</td><td>${b+d}</td><td>${T}</td></tr></table></div>The table shows how students get to school. If a Grade 10 student is selected at random, what is the probability that the student takes the bus?`,
    ...mc(fr(c,c+d),[fr(c,a+c),fr(c,T),fr(d,c+d),fr(c+d,T),fr(a,a+b),fr(a+c,T)]),
    expl:`Выбираем только из десятиклассников — их ${c+d}. На автобусе из них ${c}. Вероятность: ${c}/${c+d} = ${fr(c,c+d)}. Знаменатель — не все ${T} учеников.`};});
add('psda',2,0,'ratio',()=>{let a,b;do{a=ri(2,5);b=ri(2,7);}while(gcd(a,b)!==1);const k=ri(4,15);
  return {q:`The ratio of red marbles to blue marbles in a bag is ${a} to ${b}. If there are ${(a+b)*k} marbles in the bag and all are red or blue, how many red marbles are there?`,answer:a*k,d:[b*k,Math.round((a+b)*k*a/b),Math.round((a+b)*k/a),Math.round((a+b)*k/2)],
    expl:`Всего частей: ${a} + ${b} = ${a+b}. Одна часть: ${(a+b)*k} / ${a+b} = ${k}. Красных: ${a} · ${k} = ${a*k}.`};});

add('psda',3,0,'percent',()=>{const p=pick([10,20,25,30,40,50]),q=pick([10,20,25,30,40,50]),ans=100+p-q-p*q/100,f=x=>(+x.toFixed(1))+'%';
  return {q:`The price of a stock increased by ${p}% and then decreased by ${q}%. The final price is what percent of the original price?`,...mc(ans,[100+p-q,100+p-q+p*q/100,100-p*q/100,100-q],f),
    expl:`Множители: ${1+p/100} · ${1-q/100} = ${+(ans/100).toFixed(4)}, то есть ${f(ans)} от исходной. Проценты нельзя просто сложить и вычесть: второй процент берётся уже от новой цены.`};});
add('psda',3,0,'stats',()=>{const n=ri(4,8),mean=ri(10,30),dl=nz(-3,4),x=(n+1)*(mean+dl)-n*mean;
  return {q:`The mean of ${n} numbers is ${mean}. After one more number is added, the mean of the ${n+1} numbers is ${mean+dl}. What number was added?`,answer:x,d:[mean+dl,dl*(n+1),mean+dl*n,x+n],
    expl:`Сумма была ${n} · ${mean} = ${n*mean}, стала ${n+1} · ${mean+dl} = ${(n+1)*(mean+dl)}. Разница: ${m(x)}.`};});
add('psda',3,0,'stats',()=>{const [a,b]=pick([[1,2],[2,3],[1,3],[3,2],[1,4],[2,1]]),g=ri(4,8),t=nz(-3,3),m1=ri(65,82),m2=m1+(a+b)*t,ans=m1+b*t;
  return {q:`Class A has ${a*g} students with a mean test score of ${m1}. Class B has ${b*g} students with a mean test score of ${m2}. What is the mean test score of all the students in both classes combined?`,...mc(ans,[(m1+m2)/2,m1+a*t,m2,m1]),
    expl:`Взвешенное среднее: (${a*g} · ${m1} + ${b*g} · ${m2}) / ${(a+b)*g} = ${ans}. Просто усреднить ${m1} и ${m2} нельзя — классы разного размера.`};});

/* ---------- Geometry and Trigonometry ---------- */
add('geo',1,0,'area',()=>{const b=ri(2,7)*2,h=ri(3,12);
  return {q:`A triangle has a base of ${b} inches and a height of ${h} inches. What is the area of the triangle, in square inches?`,...mc(b*h/2,[b*h,b+h,b*h/2+b,2*b*h]),
    expl:`Площадь треугольника = ½ · основание · высота = ½ · ${b} · ${h} = ${b*h/2}.`};});
add('geo',1,0,'angles',()=>{const a=ri(25,80),b=ri(25,80);
  return {q:`In a triangle, two of the angles measure ${a}° and ${b}°. What is the measure, in degrees, of the third angle?`,answer:180-a-b,d:[a+b,180-a,180-b,360-a-b],
    expl:`Сумма углов треугольника 180°: 180 − ${a} − ${b} = ${180-a-b}.`};});
add('geo',1,0,'circle',()=>{const r=ri(3,9),t=ri(0,1);
  return t?{q:`A circle has a radius of ${r} centimeters. What is the area of the circle, in square centimeters?`,...mc(`${r*r}π`,[`${2*r}π`,`${r}π`,`${2*r*r}π`,`${4*r*r}π`]),expl:`Площадь круга = πr${sq} = π · ${r}${sq} = ${r*r}π.`}
          :{q:`A circle has a radius of ${r} centimeters. What is the circumference of the circle, in centimeters?`,...mc(`${2*r}π`,[`${r*r}π`,`${r}π`,`${4*r}π`,`${2*r*r}π`]),expl:`Длина окружности = 2πr = 2 · π · ${r} = ${2*r}π.`};});

add('geo',2,0,'pyth',()=>{const tr=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[3,4,5]]),k=ri(1,3),[a,b,c]=tr.map(v=>v*k),t=ri(0,1);
  return t?{q:`A right triangle has legs of length ${a} and ${b}. What is the length of the hypotenuse?`,answer:c,d:[a+b,a*a+b*b,Math.round(Math.sqrt(b*b-a*a)),c+a],expl:`По теореме Пифагора: ${a}${sq} + ${b}${sq} = ${a*a} + ${b*b} = ${c*c}, корень — ${c}.`}
          :{q:`A right triangle has a hypotenuse of length ${c} and one leg of length ${a}. What is the length of the other leg?`,answer:b,d:[c-a,Math.round(Math.sqrt(c*c+a*a)),c+a,c*c-a*a],expl:`По теореме Пифагора: ${c}${sq} − ${a}${sq} = ${c*c} − ${a*a} = ${b*b}, корень — ${b}.`};});
add('geo',2,0,'similar',()=>{const a=ri(3,9),k=ri(2,4),b=ri(4,12);
  return {q:`Triangles ABC and DEF are similar, where A corresponds to D and B corresponds to E. If AB = ${a}, DE = ${a*k}, and BC = ${b}, what is the length of EF?`,answer:b*k,d:[b+a*k-a,b*k*k,a*k+b,a*k],
    expl:`Коэффициент подобия: DE / AB = ${a*k} / ${a} = ${k}. EF = ${k} · BC = ${k} · ${b} = ${b*k}.`};});
add('geo',2,0,'volume',()=>{const r=ri(2,6),h=ri(3,10);
  return {q:`A right circular cylinder has a base radius of ${r} inches and a height of ${h} inches. What is the volume of the cylinder, in cubic inches?`,
    ...mc(`${r*r*h}π`,[`${2*r*h}π`,`${r*h}π`,`${4*r*r*h}π`,`${r*h*h}π`,`${r*r*h*2}π`]),
    expl:`Объём цилиндра = πr${sq}h = π · ${r*r} · ${h} = ${r*r*h}π.`};});
add('geo',2,0,'angles',()=>{const x=ri(8,20),a=ri(2,4),c=ri(1,3),b=ri(1,30),d=180-(a+c)*x-b;
  return {q:`Two angles form a straight line. Their measures are (${a}x + ${b})° and (${c===1?'':c}x + ${d})°. What is the value of x?`,answer:x,d:[a*x+b,c*x+d,Math.round((360-b-d)/(a+c)),Math.round((90+b+d)/(a+c))],
    expl:`Смежные углы в сумме дают 180°: ${a+c}x + ${b+d} = 180, ${a+c}x = ${180-b-d}, x = ${x}.`};});

add('geo',3,1,'trig',()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),t=ri(0,1);
  const all=[`${b}/${c}`,`${a}/${b}`,`${b}/${a}`,`${c}/${b}`,`${c}/${a}`,`${a}/${c}`],cor=t?`${b}/${c}`:`${a}/${b}`;

  return {q:`${plot({...PG,fns:[x=>k*x+b]})}The graph of a line is shown in the xy-plane. The line crosses the y-axis at the point (0, b). What is the value of b?`,answer:b,d:[-b,k,-b/k,b+k],
    expl:`Смотрим, где линия пересекает вертикальную ось y: в точке (0, ${m(b)}). Это и есть y-intercept.`};},1);
add('alg',2,0,'slope',()=>{let p,q;do{q=pick([1,2,3]);p=nz(-3,3);}while(gcd(Math.abs(p),q)!==1);const b=ri(-2,2);
  return {q:`${plot({...PG,fns:[x=>p/q*x+b],pts:[[0,b],[q,b+p]]})}The graph of a line is shown, with two of its points marked. What is the slope of the line?`,...FR(p,q),d:[[-p,q],[q,p],[p,1],[q,1]],
    expl:`Отмеченные точки: (0, ${m(b)}) и (${q}, ${m(b+p)}). Наклон = изменение y / изменение x = ${m(p)} / ${q}${q===1?'':' = '+frS(p,q)}. Ответ можно ввести дробью или десятичным числом.`};},0);
add('alg',2,0,'slope',()=>{const k=nz(-3,3),b=nz(-4,4);
  return {q:`${plot({...PG,fns:[x=>k*x+b]})}Which equation represents the line shown in the xy-plane?`,...mc(`y = ${lx(k,b)}`,[`y = ${lx(-k,b)}`,`y = ${lx(k,-b)}`,`y = ${lx(b,k)}`,`y = ${lx(-k,-b)}`]),
    expl:`Линия пересекает ось y в ${m(b)} — это b. При сдвиге на 1 вправо она ${k>0?'поднимается':'опускается'} на ${Math.abs(k)} — наклон ${m(k)}. Уравнение: y = ${lx(k,b)}.`};},1);
add('alg',1,0,'systems',()=>{let a,b;do{a=nz(-3,3);b=nz(-3,3);}while(a===b);const [k1,k2]=shuffle([-2,-1,1,2]);
  return {q:`${plot({...PG,fns:[x=>k1*(x-a)+b,x=>k2*(x-a)+b]})}The graphs of the two equations of a system are shown. What is the solution (x, y) to the system?`,...mc(P2(a,b),[P2(b,a),P2(-a,b),P2(a,-b),P2(-a,-b)]),
    expl:`Решение системы — точка, где линии пересекаются: ${P2(a,b)}. Сначала читаем x, потом y.`};},2);
add('alg',3,0,'slope',()=>{let p,q;do{p=nz(-5,5);q=nz(-5,5);}while(Math.abs(p)===Math.abs(q));
  const std=(A,B,C)=>`${cf(A)}x ${B<0?'−':'+'} ${Math.abs(B)===1?'':Math.abs(B)}y = ${m(C)}`;
  return {q:`${plot({...PG,fns:[x=>q-q/p*x],pts:[[p,0],[0,q]]})}The line shown passes through the two marked points on the axes. Which equation represents this line?`,...mc(std(q,p,p*q),[std(p,q,p*q),std(q,-p,p*q),std(q,p,-p*q),std(-q,p,p*q)]),
    expl:`Точки на осях: (${m(p)}, 0) и (0, ${m(q)}). Проверяем подстановкой: при y = 0 должно получиться x = ${m(p)}, при x = 0 — y = ${m(q)}. Подходит только ${std(q,p,p*q)}.`};},3);
add('alg',1,0,'slope',()=>{const a=nz(-4,4),k=pick([-2,-1,1,2]);
  return {q:`${plot({x:[-6,6],y:[-8,8],fns:[x=>k*(x-a)]})}The graph of a line is shown. The line crosses the x-axis at the point (a, 0). What is the value of a?`,answer:a,d:[-a,-k*a,k,a*k],
    expl:`x-intercept — точка, где линия пересекает горизонтальную ось x (там y = 0). По графику это ${P2(a,0)}.`};},3);
add('alg',3,0,'ineq',()=>{const k=pick([-2,-1,1,2]),b=ri(-3,3),up=ri(0,1),st=ri(0,1),s1=up?(st?'>':'≥'):(st?'&lt;':'≤'),s2=up?(st?'&lt;':'≤'):(st?'>':'≥');
  return {q:`${plot({...PG,fns:[x=>k*x+b],shade:{f:x=>k*x+b,above:!!up},dash:!!st})}The shaded region shown represents the solutions to which inequality?`,...mc(`y ${s1} ${lx(k,b)}`,[`y ${s2} ${lx(k,b)}`,`y ${s1} ${lx(-k,b)}`,`y ${s2} ${lx(-k,b)}`]),
    expl:`Граница — прямая y = ${lx(k,b)}. Закрашено ${up?'выше':'ниже'} неё, значит y ${up?'больше':'меньше'}. ${st?'Пунктирная':'Сплошная'} линия означает, что сама граница ${st?'не входит':'входит'} в решение.`};},3);
add('adv',1,0,'vertex',()=>{let h,k;const a=pick([1,-1]);do{h=nz(-3,3);k=a*-ri(1,5);}while(h===k);
  return {q:`${plot({...PG,fns:[x=>a*(x-h)**2+k]})}The graph of a quadratic function is shown. What is the vertex of the parabola?`,...mc(P2(h,k),[P2(k,h),P2(-h,k),P2(h,-k),P2(-h,-k)]),
    expl:`Вершина — самая ${a>0?'низкая':'высокая'} точка параболы: ${P2(h,k)}.`};},0);
add('adv',1,0,'vertex',()=>{const h=pick([-2,-1,1,2]),k=-ri(1,5),y=h*h+k;
  return {q:`${plot({...PG,fns:[x=>(x-h)**2+k]})}The graph of y = f(x) is shown, where f is a quadratic function. What is the y-intercept of the graph? Enter the y-coordinate.`,answer:y,d:[k,h,-y,h*h],
    expl:`y-intercept — точка пересечения с осью y, то есть значение при x = 0. По графику парабола проходит через (0, ${m(y)}).`};},3);
add('adv',2,0,'vertex',()=>{let r1,d;const a=pick([1,-1]);do{r1=nz(-4,2);d=pick([2,4]);}while(r1+d===0||r1+d===-r1||r1+d>4);const r2=r1+d,f=(s,u,v)=>`y = ${s<0?'−':''}(x ${sg(-u)})(x ${sg(-v)})`;
  return {q:`${plot({...PG,fns:[x=>a*(x-r1)*(x-r2)]})}Which equation could define the parabola shown?`,...mc(f(a,r1,r2),[f(a,-r1,-r2),f(-a,r1,r2),f(-a,-r1,-r2)]),
    expl:`Парабола пересекает ось x в ${m(r1)} и ${m(r2)}, значит множители (x ${sg(-r1)}) и (x ${sg(-r2)}): знак в скобке обратный корню. Ветви направлены ${a>0?'вверх — коэффициент положительный':'вниз — перед скобками минус'}.`};},3);
add('adv',1,0,'func',()=>{const h=ri(-2,2),k=-ri(2,5),u=pick([-2,-1,1,2]),x=h+u,y=k+u*u;
  return {q:`${plot({...PG,fns:[t=>(t-h)**2+k]})}The graph of y = f(x) is shown. What is the value of f(${m(x)})?`,answer:y,d:[x,k,-y,u*u],
    expl:`f(${m(x)}) — это высота графика над точкой x = ${m(x)}. Находим ${m(x)} на оси x, поднимаемся или опускаемся до кривой: y = ${m(y)}.`};},0);
add('adv',2,0,'expfn',()=>{const a=pick([2,3]);
  return {q:`${plot({x:[-1,5],y:[-1,13],fns:[x=>a*2**x],pts:[[0,a],[1,2*a],[2,4*a]],ty:2})}The graph of the exponential function f is shown, with three of its points marked. Which equation defines f?`,...mc(`f(x) = ${a}(2)<sup>x</sup>`,[`f(x) = 2(${a+1})<sup>x</sup>`,`f(x) = ${a}(3)<sup>x</sup>`,`f(x) = ${a}x + 2`,`f(x) = ${a+1}(2)<sup>x</sup>`]),
    expl:`При x = 0 значение ${a} — это начальный коэффициент. Каждый шаг вправо значение удваивается (${a}, ${2*a}, ${4*a}), значит основание 2: f(x) = ${a}(2)^x.`};},0);
add('adv',2,1,'systems',()=>{const h=ri(-1,1),k=-ri(2,4);const [u,v]=pick([[-2,1],[-1,2],[-2,-1],[1,2],[-1,1],[-2,2]]),A=[h+u,k+u*u],B=[h+v,k+v*v],sl=u+v,w=ri(0,1)?A:B;
  return {q:`${plot({...PG,fns:[x=>(x-h)**2+k,x=>sl*(x-A[0])+A[1]]})}The graphs of a linear equation and a quadratic equation are shown. Which of the following points is a solution to the system of the two equations?`,...mc(P2(...w),[P2(h,k),P2(w[1],w[0]),P2(w[0],-w[1]),P2(-w[0],w[1]),P2(0,(0-h)**2+k)]),
    expl:`Решения системы — точки, где прямая пересекает параболу: ${P2(...A)} и ${P2(...B)}. Вершина параболы и её пересечение с осью y решениями не являются.`};},2);
function scat(){const up=ri(0,1),s=pick([.5,1])*(up?1:-1),c=up?ri(1,2):ri(8,9),pts=[];
  for(let x=1;x<=9;x++){const e=pick([-1.4,-1,-.7,.7,1,1.4]);pts.push([x,Math.max(.3,Math.min(9.7,c+s*x+e))]);}
  return {s,c,pts,f:x=>c+s*x};}
add('psda',1,0,'scatter',()=>{let g,Xs;do{g=scat();Xs=[2,4,6,8].filter(X=>{const y=g.c+g.s*X;return y>=2&&y<=8;});}while(!Xs.length);const X=pick(Xs),v=(g.c+g.s*X)*10;
  return {q:`${plot({x:[0,10],y:[0,10],sy:10,fns:[g.f],pts:g.pts})}The scatterplot shows the relationship between two variables, x and y. A line of best fit is also shown. For x = ${X}, what y-value does the line of best fit predict?`,...mc(v,[v+10,v-10,v+20,v-20]),
    expl:`Находим x = ${X} на горизонтальной оси, поднимаемся до линии (не до точки!) и читаем значение на оси y: ${v}.`};},0);
add('psda',2,0,'scatter',()=>{const g=scat(),n=g.pts.filter(p=>p[1]>g.f(p[0])).length;
  return {q:`${plot({x:[0,10],y:[0,10],fns:[g.f],pts:g.pts})}The scatterplot shows 9 data points and a line of best fit. For how many of the data points is the actual y-value greater than the y-value predicted by the line of best fit?`,answer:n,d:[9-n,n+1,n-1,9],
    expl:`Фактическое значение больше прогноза, когда точка лежит выше линии. Считаем точки над линией: ${n}.`};},2);
add('psda',2,0,'scatter',()=>{const g=scat(),e=(s,c)=>`y = ${lx(s,c)}`;
  return {q:`${plot({x:[0,10],y:[0,10],pts:g.pts})}Which of the following equations is the most appropriate linear model for the data shown in the scatterplot?`,...mc(e(g.s,g.c),[e(-g.s,g.c),e(g.s,-g.c),e(-g.s,-g.c)]),
    expl:`Точки идут ${g.s>0?'вверх — наклон положительный':'вниз — наклон отрицательный'}. Продолжение линии пересекает ось y около ${g.c} — свободный член положительный. Подходит ${e(g.s,g.c)}.`};},1);
const CATS=[['Mon','Tue','Wed','Thu','Fri'],['Art','Music','Drama','Chess','Coding'],['Red','Blue','Green','Black','White']];
add('psda',1,0,'charts',()=>{const L=pick(CATS);let v;do{v=L.map(()=>ri(2,12)*5);}while(Math.max(...v)===Math.min(...v));let i,j;do{i=ri(0,4);j=ri(0,4);}while(v[i]<=v[j]);
  return {q:`${chart(L,v,60,10)}The bar graph shows the number of students in each of five groups. How many more students are in the ${L[i]} group than in the ${L[j]} group?`,answer:v[i]-v[j],d:[v[i]+v[j],v[i],v[j],(v[i]-v[j])/5],
    expl:`Читаем высоту столбцов: ${L[i]} — ${v[i]}, ${L[j]} — ${v[j]}. Разница: ${v[i]-v[j]}.`};},0);
add('psda',2,0,'charts',()=>{const L=pick(CATS),v=L.map(()=>ri(2,12)*5),i=ri(0,4),T=v.reduce((a,b)=>a+b,0);
  return {q:`${chart(L,v,60,10)}The bar graph shows the number of students in each of five groups. What fraction of all the students are in the ${L[i]} group?`,...FR(v[i],T),d:[[v[i],T-v[i]],[1,5],[v[i],100],[T-v[i],T]],
    expl:`Всего студентов: ${v.join(' + ')} = ${T}. В группе ${L[i]} — ${v[i]}. Доля: ${v[i]}/${T} = ${frS(v[i],T)}.`};},0);
function yrs(){const y0=2015,L=[],v=[ri(2,5)*10];for(let i=0;i<7;i++){L.push(y0+i);if(i)v.push(Math.max(10,Math.min(90,v[i-1]+pick([-20,-10,10,10,20,30,40]))));}return {L,v};}
add('psda',1,0,'charts',()=>{let g,d,mx;do{g=yrs();d=g.v.slice(1).map((x,i)=>x-g.v[i]);mx=Math.max(...d);}while(mx<=0||d.filter(x=>x===mx).length>1);const i=d.indexOf(mx),f=k=>`${g.L[k]} and ${g.L[k+1]}`;
  return {q:`${chart(g.L,g.v,100,20,true)}The line graph shows the number of members of a club at the end of each year. Between which two consecutive years did the number of members increase the most?`,...mc(f(i),[0,1,2,3,4,5].filter(k=>k!==i).map(f)),
    expl:`Самый крутой подъём линии — между ${g.L[i]} и ${g.L[i+1]}: с ${g.v[i]} до ${g.v[i+1]}, рост на ${mx}.`};},1);
add('psda',2,0,'charts',()=>{const g=yrs(),i=ri(0,3),j=i+ri(2,3),dv=g.v[j]-g.v[i];
  return {q:`${chart(g.L,g.v,100,20,true)}The line graph shows the number of members of a club at the end of each year. What was the average rate of change, in members per year, from ${g.L[i]} to ${g.L[j]}?`,...FR(dv,j-i),d:[[dv,1],[dv,j-i+1],[g.v[j]+g.v[i],j-i],[-dv,j-i]],
    expl:`Средняя скорость изменения = (конечное − начальное) / число лет = (${g.v[j]} − ${g.v[i]}) / ${j-i} = ${frS(dv,j-i)}. Промежуточные годы не важны.`};},2);
add('psda',2,0,'stats',()=>{const c=[ri(1,4),ri(2,5),ri(2,5),ri(1,4),0];c[4]=20-c[0]-c[1]-c[2]-c[3];const s=c.reduce((a,x,i)=>a+x*i,0);
  return {q:`${tbl(['Number of pets','Number of students'],c.map((x,i)=>[i,x]))}The table shows the number of pets owned by each of 20 students. What is the mean number of pets per student?`,...DEC(s/20),d:[2,s/5,s/10,4],
    expl:`Сумма: ${c.map((x,i)=>`${i} · ${x}`).join(' + ')} = ${s}. Делим на 20 учеников: ${+(s/20).toFixed(2)}. Каждое значение умножаем на то, сколько раз оно встречается.`};},0);
add('psda',3,0,'stats',()=>{const c=[ri(2,6),ri(2,6),ri(2,6),ri(2,6),0];let n=c[0]+c[1]+c[2]+c[3];c[4]=(n%2?2:1)+ri(0,1)*2;n+=c[4];const mid=(n+1)/2;let cum=0,med=0;for(let i=0;i<5;i++){cum+=c[i];if(cum>=mid){med=i+1;break;}}
  return {q:`${tbl(['Score','Number of quizzes'],c.map((x,i)=>[i+1,x]))}The table shows the scores on ${n} quizzes. What is the median score?`,answer:med,d:[3,c.indexOf(Math.max(...c))+1,med+1,med-1,c[2]],
    expl:`Всего ${n} значений, медиана — ${mid}-е по порядку. Считаем накопленным итогом по строкам таблицы: ${mid}-е значение попадает на оценку ${med}.`};},1);
add('psda',2,0,'prob',()=>{const a=ri(8,40),b=ri(8,40),c=ri(8,40),d=ri(8,40);
  return {q:`${tbl(['','Bus','Car','Total'],[['Grade 9',a,b,a+b],['Grade 10',c,d,c+d],['Total',a+c,b+d,a+b+c+d]])}The table shows how students get to school. If one of the students who travel by car is selected at random, what is the probability that the student is in Grade 9?`,...FR(b,b+d),d:[[b,a+b],[b,a+b+c+d],[d,b+d],[b,d]],
    expl:`Выбираем только из тех, кто ездит на машине: их ${b+d}. Из них девятиклассников ${b}. Вероятность: ${b}/${b+d}${frS(b,b+d)===`${b}/${b+d}`?'':' = '+frS(b,b+d)}.`};},1);
add('geo',1,0,'angles',()=>{const a=ri(25,65),opp=ri(0,1);
  return {q:`${opp?crossFig(a+'°','x°','',''):crossFig(a+'°','','x°','')}${NTS}Two lines intersect as shown. What is the value of x?`,answer:opp?a:180-a,d:[a,180-a,Math.abs(90-a),2*a,360-a],
    expl:opp?`Углы напротив друг друга — вертикальные, они равны: x = ${a}.`:`Соседние углы при пересечении двух прямых — смежные, в сумме 180°: x = 180 − ${a} = ${180-a}.`};},0);
add('geo',2,0,'angles',()=>{const a=ri(35,80),pos=pick(['corr','alt','same']);
  return {q:`${parFig(a+'°','x°',pos)}${NTS}In the figure, lines ℓ and k are parallel. What is the value of x?`,answer:pos==='same'?180-a:a,d:[a,180-a,Math.abs(90-a),2*a,360-a],
    expl:pos==='same'?`Эти углы лежат между параллельными прямыми по одну сторону от секущей (same-side interior) — в сумме 180°: x = ${180-a}.`:`Это ${pos==='corr'?'соответственные (corresponding)':'накрест лежащие (alternate interior)'} углы при параллельных прямых — они равны: x = ${a}.`};},1);
add('geo',2,0,'angles',()=>{const a=ri(30,70),c=ri(30,70);
  return {q:`${triExt(a+'°',c+'°','x°')}${NTS}In the figure, side AB of triangle ABC is extended past B. What is the value of x?`,answer:a+c,d:[180-a-c,180-a,180-c,360-a-c],
    expl:`Внешний угол треугольника равен сумме двух внутренних, не смежных с ним: x = ${a} + ${c} = ${a+c}.`};},3);
add('geo',2,1,'trig',()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=ri(1,2),t=pick(['sin','cos','tan']),cor={sin:[a,c],cos:[b,c],tan:[a,b]}[t];
  return {q:`${rtFig(b*k,a*k,c*k)}${NTS}In right triangle ABC shown, angle C is the right angle. What is the value of ${t} A?`,...mc(fr(...cor),[fr(a,c),fr(b,c),fr(a,b),fr(b,a),fr(c,b),fr(c,a)]),
    expl:`Относительно угла A: противолежащий катет BC = ${a*k}, прилежащий AC = ${b*k}, гипотенуза AB = ${c*k}. ${t} A = ${t==='sin'?'противолежащий / гипотенуза':t==='cos'?'прилежащий / гипотенуза':'противолежащий / прилежащий'} = ${fr(...cor)}.`};},0);
add('geo',2,0,'area',()=>{const W=ri(8,14),H=ri(6,10),w=ri(2,W-3),h=ri(2,H-2);
  return {q:`${lFig(W,H,W-w,H-h)}${NTS}All angles in the figure shown are right angles, and the side lengths are given in meters. What is the area of the figure, in square meters?`,answer:W*H-w*h,d:[W*H,w*h,W*H-(W-w)*(H-h),2*(W+H),W*H+w*h],
    expl:`Достраиваем до прямоугольника ${W} × ${H} = ${W*H}. Вырезанный угол: (${W} − ${W-w}) × (${H} − ${H-h}) = ${w} × ${h} = ${w*h}. Площадь: ${W*H} − ${w*h} = ${W*H-w*h}.`};},1);
add('geo',2,0,'similar',()=>{const a=pick([4,6,8]),k=pick([1.5,2,2.5,3]),b=ri(3,9);
  return {q:`${simFig(a,b,a*k,'x')}${NTS}The two triangles shown are similar, with corresponding sides labeled. What is the value of x?`,...DEC(b*k),d:[b+a*k-a,Math.round(b/k*100)/100,a*k+b,b*k*k],
    expl:`Коэффициент подобия: ${a*k} / ${a} = ${k}. Сторона x соответствует стороне ${b}: x = ${b} · ${k} = ${b*k}.`};},0);
add('geo',3,0,'pyth',()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15]]),ar=ri(0,1);
  return {q:`${rtFig('',a,c)}${NTS}In right triangle ABC shown, angle C is the right angle, BC = ${a}, and AB = ${c}. What is the ${ar?'area':'perimeter'} of the triangle?`,answer:ar?a*b/2:a+b+c,d:ar?[a*b,a*c/2,a+b+c,b]:[a+c,a*b/2,a+b,2*a+c],
    expl:`Сначала второй катет: AC = √(${c}${sq} − ${a}${sq}) = √${c*c-a*a} = ${b}. ${ar?`Площадь = ½ · ${a} · ${b} = ${a*b/2}`:`Периметр = ${a} + ${b} + ${c} = ${a+b+c}`}.`};},0);
add('geo',3,2,'circle',()=>{const [th,r]=pick([[90,4],[90,6],[90,8],[60,6],[60,12],[120,3],[120,6],[120,9],[45,4],[45,8]]),n=r*r*th/360,f=x=>x===1?'π':`${m(+x.toFixed(2))}π`;

/* shared question markup */
function qHTML(p,a,locked){
  let h=`<div class="q">${p.q}</div>`;
  if(p.choices)h+=`<div class="opts">${p.choices.map((c,i)=>{let cls='opt';if(locked){if(i===p.answer)cls+=' ok';else if(i===a)cls+=' no';}
    return `<button class="${cls}" data-i="${i}" aria-pressed="${!locked&&a===i}" ${locked?'disabled':''}><i>${'ABCD'[i]}</i><span>${c}</span></button>`;}).join('')}</div>`;
  else h+=`<label class="grid-in"><span>Впиши ответ: целое, дробь или десятичное</span><input class="gi" inputmode="text" autocomplete="off" placeholder="Например, 12, 3/4 или 0.75" value="${a==null?'':String(a).replace(/"/g,'')}" ${locked?'disabled':''}></label>`;
  return h;
}
const answered=(p,a)=>p.choices?a!=null:(a!=null&&String(a).trim()!=='');
function isRight(p,a){
  if(!answered(p,a))return false;
  if(p.choices)return a===p.answer;
  const v=parseNum(a);
  return Number.isFinite(v)&&Math.abs(v-p.answer)<=(Number.isInteger(p.answer)?1e-9:0.0011);
}
function parseNum(a){const s=String(a).trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');const f=s.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/);if(f)return +f[2]?+f[1]/+f[2]:NaN;return s===''?NaN:Number(s);}
const rightText=p=>p.choices?'ABCD'[p.answer]+') '+p.choices[p.answer]:(p.ansText||m(p.answer));
const bookLink=p=>`<button class="btn ghost sm" data-topic="${p.topic}" data-rule="${p.rule}">Открыть правило в учебнике</button>`;

function paintTimer(){
  const s=Math.floor((Date.now()-P.t0)/1000),avg=TESTS[pref.test].avg,el=$('timer');
  el.textContent=fmtTime(s);el.className='tm '+(s>avg?'over':s>=avg-20?'warn':'ok');

}
function next(){
  const T0=TESTS[pref.test],sec=pref.sec==='all'?Object.keys(T0.w)[wpick(Object.values(T0.w))]:pref.sec,lvl=pref.lvl||wpick(T0.lv)+1;

  stats.s[p.sec][1]++;if(ok){stats.s[p.sec][0]++;stats.streak++;}else stats.streak=0;save();renderStats();

  const fb=$('fb');fb.hidden=false;fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=`<b>${ok?'Верно':'Неверно. Правильный ответ: '+rightText(p)}</b><p>${p.expl}</p>${bookLink(p)}`;
  $('go').textContent='Следующая задача';$('go').disabled=false;
}

/* ---------- timed test ---------- */
let T=null,tTick=null;
function domCounts(w,n){const ks=Object.keys(w),raw=ks.map(k=>w[k]*n),fl=raw.map(Math.floor);let rest=n-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(o=>fl[o[1]]++);
  return Object.fromEntries(ks.map((k,i)=>[k,fl[i]]));}
function buildModule(tk,variant){
  const t=TESTS[tk];let lv=t.lv.slice();
  if(variant==='hard')lv=[lv[0]*.4,lv[1],lv[2]*2.2];
  if(variant==='easy')lv=[lv[0]*1.9,lv[1],lv[2]*.3];
  const c=domCounts(t.w,NQ),qs=[];
  for(const s in c)for(let i=0;i<c[s];i++)qs.push(generate(s,wpick(lv)+1,t.tier));
  return shuffle(qs).sort((a,b)=>a.lvl-b.lvl);
}
function startTest(mode){
  T={test:pref.test,mode,mod:0,mods:[buildModule(pref.test,'base')],ans:[[]],flag:[[]],i:0,used:[],path:null,phase:'run',pal:false};
  startClock();renderTest();
}
function startClock(){T.end=Date.now()+MOD_MIN*60000;T.t0=Date.now();clearInterval(tTick);tTick=setInterval(paintClock,1000);}
function paintClock(){
  if(!T||T.phase!=='run'){clearInterval(tTick);return;}
  const left=Math.max(0,Math.round((T.end-Date.now())/1000)),el=$('tClock');
  if(el){el.textContent=fmtTime(left);el.className='tm '+(left<=60?'over':left<=300?'warn':'ok');}
  if(left<=0)endModule();
}
function endModule(){
  clearInterval(tTick);T.used[T.mod]=Math.min(MOD_MIN*60,Math.round((Date.now()-T.t0)/1000));
  if(T.mode==='full'&&T.mod===0){
    const c=T.mods[0].filter((p,i)=>isRight(p,T.ans[0][i])).length;
    T.path=c/NQ>=.6?'hard':'easy';T.mods.push(buildModule(T.test,T.path));T.ans.push([]);T.flag.push([]);T.phase='break';
  }else finishTest();
  if(view==='test')renderTest();
}
function finishTest(){
  const t=TESTS[T.test],W={1:1,2:1.25,3:1.5};let got=0,all=0,c=0,n=0;const dom={alg:[0,0],adv:[0,0],psda:[0,0],geo:[0,0]};
  T.mods.forEach((qs,mi)=>qs.forEach((p,i)=>{const ok=isRight(p,T.ans[mi][i]);all+=W[p.lvl];n++;dom[p.sec][1]++;if(ok){got+=W[p.lvl];c++;dom[p.sec][0]++;}}));
  let f=got/all;if(T.path==='easy')f=Math.min(f,.74);
  const score=Math.round((t.scale[0]+(t.scale[1]-t.scale[0])*f)/10)*10;
  T.res={c,n,dom,score,time:T.used.reduce((a,b)=>a+b,0)};T.phase='done';
  hist.unshift({d:new Date().toLocaleDateString('ru-RU'),test:t.name,mode:T.mode,c,n,score});hist=hist.slice(0,10);store('satmath-hist',hist);
}
function renderTest(){
  const el=$('v-test'),t=TESTS[pref.test];
  if(!T||T.phase==='idle'){
    el.innerHTML=`<div class="card"><h2>Тест на время: ${t.name} Math</h2>
      <p>Как на настоящем экзамене: модуль из ${NQ} вопросов на ${MOD_MIN} минут, в среднем ${fmtTime(t.avg)} на вопрос. Можно возвращаться к вопросам и отмечать их для проверки. Второй модуль подбирается по результату первого: решил хорошо — он будет сложнее.</p>
      <p class="muted">Desmos доступен на всех вопросах. После теста — результат, оценка балла и разбор каждого задания.</p>
      <button class="btn" data-start="full">Полный тест: 2 модуля, ${MOD_MIN*2} минут</button>
      <button class="btn ghost" data-start="one">Один модуль: ${NQ} вопроса, ${MOD_MIN} минут</button></div>
      <div class="card"><h3>Прошлые результаты</h3><div>${hist.length?hist.map(h=>`<div class="hist"><span>${h.d} · ${h.test} · ${h.mode==='full'?'полный':'1 модуль'}</span><b>${h.c}/${h.n} · ≈${h.score}</b></div>`).join(''):'<p class="muted">Здесь появятся результаты пройденных тестов.</p>'}</div></div>`;
    return;
  }
  if(T.phase==='break'){
    el.innerHTML=`<div class="card"><h2>Модуль 1 завершён</h2><p>Ответы сохранены. Второй модуль подобран по результату первого. Таймер запустится, когда нажмёшь кнопку.</p><button class="btn" data-next-mod>Начать модуль 2</button></div>`;return;
  }
  if(T.phase==='done'){renderResult(el);return;}
  const qs=T.mods[T.mod],p=qs[T.i],a=T.ans[T.mod][T.i],fl=T.flag[T.mod],nAns=qs.filter((q,i)=>answered(q,T.ans[T.mod][i])).length;
  el.innerHTML=`<div class="card">
    <div class="thead"><b>${T.mode==='full'?`Модуль ${T.mod+1} из 2 · `:''}Вопрос ${T.i+1} из ${NQ}</b><div class="metaR"><button class="mini" data-calc>Desmos</button><span class="tm ok" id="tClock">${fmtTime(Math.max(0,Math.round((T.end-Date.now())/1000)))}</span></div></div>
    <div class="qwrap" id="tQ">${qHTML(p,a,false)}</div>
    <div class="btnrow"><button class="btn ghost" data-nav="-1" ${T.i===0?'disabled':''}>Назад</button><button class="btn ghost" data-flag>${fl[T.i]?'Снять отметку':'Отметить'}</button><button class="btn" data-nav="1" ${T.i===NQ-1?'disabled':''}>Далее</button></div>
    <button class="link" data-pal>${T.pal?'Скрыть список вопросов':`Все вопросы · отвечено ${nAns} из ${NQ}`}</button>
    ${T.pal?`<div class="pal">${qs.map((q,i)=>`<button data-go="${i}" class="${answered(q,T.ans[T.mod][i])?'ans':''} ${fl[i]?'flag':''} ${i===T.i?'cur':''}">${i+1}</button>`).join('')}</div><p class="muted">Закрашены отвеченные, с жёлтой полоской — отмеченные для проверки.</p>`:''}
    <button class="btn ghost" data-end>Завершить модуль</button></div>`;
  paintClock();
}
function renderResult(el){
  const r=T.res,t=TESTS[T.test];let k=0;
  el.innerHTML=`<div class="card"><h3>${t.name} Math · ${T.mode==='full'?'полный тест':'один модуль'}</h3>
    <div class="score">≈ ${r.score} <small>из ${t.scale[1]}</small></div>
    <p>Верно ${r.c} из ${r.n} · время ${fmtTime(r.time)}${T.path?` · второй модуль был ${T.path==='hard'?'сложнее':'легче'}`:''}</p>
    <p class="muted">Балл приблизительный: настоящая шкала College Board учитывает сложность каждого вопроса по закрытой формуле.</p>
    <div class="rows">${Object.keys(SEC_NAME).map(s=>{const [a,b]=r.dom[s];return b?`<div class="row"><span>${SEC_NAME[s]}</span><span>${a} из ${b}</span><div class="bar"><div style="width:${a/b*100}%"></div></div></div>`:'';}).join('')}</div>
    <div class="btnrow"><button class="btn ghost" data-reset>Новый тест</button><button class="btn" data-practice>К тренировке</button></div></div>
    <h3>Разбор заданий</h3>
    ${T.mods.map((qs,mi)=>qs.map((p,i)=>{k++;const a=T.ans[mi][i],has=answered(p,a),ok=isRight(p,a);
      return `<details><summary><span>№${k} · ${SEC_NAME[p.sec]} <small>· ${LVL_NAME[p.lvl]}</small></span><span class="st ${ok?'ok':has?'no':'skip'}">${ok?'верно':has?'ошибка':'пропуск'}</span></summary>
        <div class="in">${qHTML(p,a,true)}<div class="fb ${ok?'good':'bad'}"><b>${ok?'Верно':'Правильный ответ: '+rightText(p)}</b><p>${p.expl}</p>${bookLink(p)}</div></div></details>`;}).join('')).join('')}`;
}
$('v-test').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.start)startTest(d.start);
  else if('nextMod' in d){T.mod=1;T.i=0;T.pal=false;T.phase='run';startClock();renderTest();}
  else if(d.nav){T.i=Math.max(0,Math.min(NQ-1,T.i+ +d.nav));renderTest();}
  else if(d.go){T.i=+d.go;renderTest();}
  else if('flag' in d){T.flag[T.mod][T.i]=!T.flag[T.mod][T.i];renderTest();}
  else if('pal' in d){T.pal=!T.pal;renderTest();}
  else if('end' in d){const left=T.mods[T.mod].filter((q,i)=>!answered(q,T.ans[T.mod][i])).length;
    ask(left?`Без ответа осталось вопросов: ${left}. Завершить модуль? Вернуться к нему будет нельзя.`:'Завершить модуль? Вернуться к нему будет нельзя.','Завершить',endModule);}
  else if('reset' in d){T=null;renderTest();}
  else if('practice' in d){show('practice');}
  else if(b.classList.contains('opt')&&T&&T.phase==='run'){T.ans[T.mod][T.i]=+d.i;$('tQ').querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));}
});
$('v-test').addEventListener('input',e=>{if(e.target.classList.contains('gi')&&T&&T.phase==='run')T.ans[T.mod][T.i]=e.target.value;});

/* ---------- textbook ---------- */
const topicOf=id=>{for(const d of BOOK)for(const t of d.topics)if(t.id===id)return t;return BOOK[0].topics[0];};
const tierBadge=t=>t.tier===2?'<span class="badge">только SAT</span>':t.tier===1?'<span class="badge">нет в PSAT 8/9</span>':'';
function renderBook(){
  $('v-book').innerHTML=`<button class="btn sm" id="bookBack" hidden>← Вернуться к задаче</button><input class="search" id="bookSearch" type="search" placeholder="Поиск: slope, проценты, vertex…" autocomplete="off">
    <p class="muted">Правила записаны как на тесте, по-английски. Нажми на правило — откроется пояснение на русском с примером.</p>
    ${BOOK.map(d=>`<div class="dom" data-dom><h2>${d.name} <span class="muted">· ${d.ru}</span></h2>
      ${d.topics.map(t=>`<details id="topic-${t.id}"><summary><span>${t.name} <small>· ${t.ru}</small></span>${tierBadge(t)}</summary><div class="in">
        ${t.rules.map(r=>`<div class="rule"><button aria-expanded="false"><span>${r.f}</span></button><div class="ex"><p>${r.d}</p>${r.ex?`<code>${r.ex}</code>`:''}${r.fig?FIG[r.fig]():''}</div></div>`).join('')}
      </div></details>`).join('')}</div>`).join('')}
    <div class="dom" data-dom><h2>Словарь терминов <span class="muted">· ${GLOSS.length} слов</span></h2>
      <details id="gloss"><summary><span>English → русский</span></summary><div class="in"><div class="gl">${GLOSS.map(g=>`<b data-g>${g[0]}</b><span>${g[1]}</span>`).join('')}</div></div></details></div>`;
}
$('v-book').addEventListener('click',e=>{if(e.target.id==='bookBack'){const v=backTo;backTo=null;keepTest=true;show(v);keepTest=false;return;}const b=e.target.closest('.rule>button');if(!b)return;const r=b.parentElement,o=r.classList.toggle('open');b.setAttribute('aria-expanded',o);});
$('v-book').addEventListener('input',e=>{
  if(e.target.id!=='bookSearch')return;const q=e.target.value.trim().toLowerCase();
  $('v-book').querySelectorAll('details').forEach(d=>{
    if(d.id==='gloss'){let any=false;d.querySelectorAll('[data-g]').forEach(g=>{const hit=!q||(g.textContent+g.nextElementSibling.textContent).toLowerCase().includes(q);g.hidden=g.nextElementSibling.hidden=!hit;any=any||hit;});d.hidden=!any;d.open=!!q&&any;return;}
    const head=d.querySelector('summary').textContent.toLowerCase().includes(q);let any=false;
    d.querySelectorAll('.rule').forEach(r=>{const hit=!q||head||r.textContent.toLowerCase().includes(q);r.hidden=!hit;any=any||hit;});
    d.hidden=!any;d.open=!!q&&any;
  });
  $('v-book').querySelectorAll('[data-dom]').forEach(s=>{s.hidden=![...s.querySelectorAll('details')].some(d=>!d.hidden);});
});
function openTopic(id,rule){
  backTo=view==='book'?backTo:view;const y=window.scrollY;backY=y;show('book');const s=$('bookSearch');if(s.value){s.value='';s.dispatchEvent(new Event('input',{bubbles:true}));}
  const d=$('topic-'+id);if(!d)return;d.open=true;document.querySelectorAll('.rule.hit').forEach(r=>r.classList.remove('hit'));
  const rs=d.querySelectorAll('.rule'),t=rs[rule]||rs[0];rs.forEach(r=>{const o=r===t;r.classList.toggle('open',o);r.firstElementChild.setAttribute('aria-expanded',o);});
  t.classList.add('hit');t.scrollIntoView({block:'center'});
}
let backY=0;
document.addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(b)openTopic(b.dataset.topic,+b.dataset.rule||0);
  if(e.target.closest('[data-calc]'))openCalc();});

/* ---------- calculators ---------- */
const frames={};
function frameFor(key){
  const tool=TOOLS.find(t=>t[0]===key);
  if(!EMBED){const d=document.createElement('div');d.className='ph';
    d.innerHTML=`<b>${tool[1]}</b><p class="muted">В предпросмотре внешние сайты не встраиваются. В боте здесь откроется калькулятор.</p><a href="${tool[2]}" target="_blank" rel="noopener">Открыть ${tool[1]} в браузере</a>`;return d;}
  if(!frames[key]){const f=document.createElement('iframe');f.src=tool[2];f.title=tool[1];f.allow='fullscreen';frames[key]=f;}
  return frames[key];
}
function openCalc(){const box=$('calcFrame');if(!box.firstChild)box.appendChild(frameFor('desmos'));else if(EMBED&&box.firstChild!==frames.desmos)box.replaceChildren(frames.desmos);$('calc').hidden=false;}
$('calcClose').addEventListener('click',()=>{$('calc').hidden=true;});
function renderTools(){
  $('toolSeg').innerHTML=TOOLS.map(t=>`<button data-k="${t[0]}" aria-pressed="${pref.tool===t[0]}">${t[1]}</button>`).join('');
  $('toolBox').replaceChildren(frameFor(pref.tool));
  $('toolNote').innerHTML=pref.tool==='desmos'?'Это тот же графический калькулятор Desmos, что встроен в настоящий тест. Он же открывается кнопкой Desmos в тренировке и в тесте.':'GeoGebra на экзамене нет. Здесь она для разбора задач: построить чертёж, проверить углы и длины.';
}
$('toolSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pref.tool=b.dataset.k;save();renderTools();});

/* ---------- settings ---------- */
function renderSettings(){
  const pct=w=>Object.keys(w).map(k=>`${SEC_NAME[k].split(' ')[0]} ${Math.round(w[k]*1000)/10}%`).join(' · ');
  $('v-settings').innerHTML=`<div class="group"><h3>Какой тест готовишь</h3>
    ${Object.keys(TESTS).map(k=>{const t=TESTS[k];return `<button class="pick" data-test="${k}" aria-pressed="${pref.test===k}"><b>${t.name} <span>· ${t.who} · шкала ${t.scale[0]}–${t.scale[1]}</span></b><span>${t.note}</span><span>${pct(t.w)}</span></button>`;}).join('')}</div>
    <p class="muted">От выбора зависят сложность и набор тем в тренировке, состав модулей в тесте на время и шкала баллов. Формат у всех четырёх одинаковый: 2 модуля по ${NQ} вопроса, ${MOD_MIN} минут на модуль.</p>
    <div class="card"><h3>Статистика</h3><p class="muted">Счётчики тренировки и история тестов хранятся на этом устройстве.</p><button class="btn ghost" data-wipe>Сбросить статистику</button></div>`;
}
$('v-settings').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.test){pref.test=b.dataset.test;save();renderFilters();renderSettings();next();if(T&&T.phase!=='run'&&T.phase!=='break')T=null;}
  else if('wipe' in b.dataset)ask('Сбросить счётчики тренировки и историю тестов?','Сбросить',()=>{stats=blank();hist=[];save();store('satmath-hist',hist);renderStats();});
});

try{const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light';}}catch(e){}
renderFilters();renderStats();renderBook();next();
</script>
