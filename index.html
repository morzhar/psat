<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pmath</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-width column with a bottom tab bar — practice, timed test, textbook, calculators, settings. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#141a2a; --muted:#5f6a82; --line:#d6dbe6;
  --accent:#2747d6; --accent-ink:#ffffff; --accent-soft:#e4e9fb;
  --good:#1c8a55; --good-soft:#e0f3e9; --warn:#a86a00; --warn-soft:#fbeed0; --bad:#c93a3a; --bad-soft:#fae6e6;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-q:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --surface:#181e30; --ink:#e9ecf5; --muted:#98a2bb; --line:#2a3350;
    --accent:#7f96ff; --accent-ink:#0f1320; --accent-soft:#222b4d;
    --good:#4cc38a; --good-soft:#163527; --warn:#f0b84a; --warn-soft:#3a2e12; --bad:#f07171; --bad-soft:#3b1d22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#181e30; --ink:#e9ecf5; --muted:#98a2bb; --line:#2a3350;
  --accent:#7f96ff; --accent-ink:#0f1320; --accent-soft:#222b4d;
  --good:#4cc38a; --good-soft:#163527; --warn:#f0b84a; --warn-soft:#3a2e12; --bad:#f07171; --bad-soft:#3b1d22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:14px 16px 84px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:0}
p{margin:0}
.view{display:flex;flex-direction:column;gap:14px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font-size:13.5px;font-weight:500;padding:7px 4px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.meta .tags,.metaR{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.lv{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tm{font-variant-numeric:tabular-nums;font-weight:700;padding:3px 9px;border-radius:999px;font-size:13px}
.tm.ok{background:var(--good-soft);color:var(--good)}
.tm.warn{background:var(--warn-soft);color:var(--warn)}
.tm.over{background:var(--bad-soft);color:var(--bad)}
.mini{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.q{font-family:var(--font-q);font-size:18.5px;line-height:1.5;text-wrap:pretty}
.q .eq{display:block;text-align:center;margin:8px 0;font-size:19px}
.q table{border-collapse:collapse;margin:10px auto;font-family:var(--font-ui);font-size:14px;font-variant-numeric:tabular-nums}
.q th,.q td{border:1px solid var(--line);padding:5px 10px;text-align:center}
.q th{font-weight:600;color:var(--muted)}
.tw{overflow-x:auto}
.qwrap{display:flex;flex-direction:column;gap:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--font-q);font-size:17.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt i{font-family:var(--font-ui);font-style:normal;font-size:12.5px;font-weight:700;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok i{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no i{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.grid-in{display:flex;flex-direction:column;gap:6px}
.grid-in input,.search{font-family:var(--font-q);font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.search{font-family:var(--font-ui);font-size:15px;background:var(--surface)}
.grid-in span{font-size:12.5px;color:var(--muted)}
.btn{font-weight:600;font-size:15px;padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.fb{border-radius:12px;padding:12px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.note{background:var(--accent-soft)}
.fb b{font-size:15px} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.row span:last-of-type{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--accent);border-radius:3px}
.link{font-size:13.5px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;align-self:flex-start;text-align:left}
.muted{color:var(--muted);font-size:13.5px}
[hidden]{display:none!important}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,calc((100% - 520px)/2)) calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;border-radius:10px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* test */
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.thead b{font-size:14px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{height:36px;border-radius:8px;border:1px dashed var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.pal button.ans{border-style:solid;background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.pal button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.pal button.cur{border:2px solid var(--accent)}
.score{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:15px;color:var(--muted);font-weight:500}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary small{font-weight:500;color:var(--muted);font-size:12.5px}
details>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.st{font-weight:700;flex:none}.st.ok{color:var(--good)}.st.no{color:var(--bad)}.st.skip{color:var(--muted)}
.hist{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
/* book */
.dom{display:flex;flex-direction:column;gap:8px}
.rule{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rule>button{width:100%;text-align:left;background:var(--bg);border:0;padding:10px 12px;font-family:var(--font-q);font-size:16.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rule>button::after{content:"?";font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:18px;height:18px;flex:none;display:grid;place-items:center}
.rule.open>button::after{content:"–"}
.rule .ex{padding:10px 12px;display:none;flex-direction:column;gap:8px;font-size:14.5px}
.rule.open .ex{display:flex}
.rule .ex code{font-family:var(--font-q);font-size:15.5px;background:var(--accent-soft);padding:6px 10px;border-radius:8px;display:block}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.fig{width:100%;max-width:300px;height:auto;align-self:center}
.fig text{font-family:var(--font-ui);font-size:11px;fill:var(--muted)}
.fig .ta{fill:var(--accent);font-weight:600}
.fig .fl{stroke:var(--muted);stroke-width:1;fill:none;opacity:.6}
.fig .fs{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round}
.fig .fa{stroke:var(--accent);stroke-width:2.2;fill:none}
.fig .fd{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4;fill:none}
.fig .dot{fill:var(--accent)} .fig .dot2{fill:var(--ink);opacity:.7}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px}
.gl b{font-family:var(--font-q);font-weight:500;font-size:15px}
/* settings */
.pick{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick b{font-size:15.5px}
.pick span{font-size:13px;color:var(--muted)}
/* calculator sheet + tools */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.sheet .bar2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.frame{flex:1;min-height:0;display:flex}
.frame iframe,.toolbox iframe{border:0;width:100%;height:100%;flex:1;min-width:0;background:#fff}
.toolbox{height:calc(100dvh - 210px);min-height:380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;background:var(--surface)}
.ph{padding:20px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:flex-start}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:30;display:grid;place-items:center;padding:20px}
.modal .card{max-width:360px;width:100%}
@media (prefers-reduced-motion:no-preference){.bar div{transition:width .3s}}

.btn.sm{padding:9px 12px;font-size:14px;width:auto;align-self:flex-start}
.rule.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#bookBack{position:sticky;top:8px;z-index:3}
</style>
</head>
<body>
<div class="app">
  <header><h1>Pmath</h1><button class="chip" id="testChip" title="Сменить тип теста"></button></header>

  <section class="view" id="v-practice">
    <div class="strip">
      <div class="tile"><b id="sTotal">0</b><small>решено</small></div>
      <div class="tile"><b id="sAcc">—</b><small>точность</small></div>
      <div class="tile"><b id="sStreak">0</b><small>серия подряд</small></div>
    </div>
    <div class="group"><h3>Секция</h3><div class="chips" id="secs"></div></div>
    <div class="group"><h3>Сложность</h3><div class="seg" id="lvls"></div></div>
    <div class="card">
      <div class="meta"><div class="tags"><span class="tag" id="tSec"></span><span class="tag lv" id="tLvl"></span></div>
        <div class="metaR"><button class="mini" data-calc>Desmos</button><span class="tm ok" id="timer">0:00</span></div></div>
      <div class="qwrap" id="pQ"></div>
      <div class="fb" id="fb" hidden></div>
      <button class="btn" id="go" disabled>Проверить</button>
    </div>
    <div class="card"><h3>Точность по секциям</h3><div class="rows" id="rows"></div></div>
  </section>

  <section class="view" id="v-test" hidden></section>
  <section class="view" id="v-book" hidden></section>
  <section class="view" id="v-tools" hidden>
    <div class="seg" id="toolSeg"></div>
    <div class="toolbox" id="toolBox"></div>
    <p class="muted" id="toolNote"></p>
  </section>
  <section class="view" id="v-settings" hidden></section>
</div>

<nav class="tabs" id="tabs">
  <button data-v="practice" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>Тренировка</button>
  <button data-v="test"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Тест</button>
  <button data-v="book"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1V5z"/><path d="M12 6v14"/></svg>Учебник</button>
  <button data-v="tools"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>Калькулятор</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
</nav>

<div class="sheet" id="calc" hidden>
  <div class="bar2"><b>Desmos</b><button class="mini" id="calcClose">Закрыть</button></div>
  <div class="frame" id="calcFrame"></div>
</div>
<div class="modal" id="dlg" hidden><div class="card"><p id="dlgText"></p><div class="btnrow"><button class="btn ghost" id="dlgNo">Отмена</button><button class="btn" id="dlgYes">Да</button></div></div></div>

<script>
/*GEN-START*/
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=(a,b)=>{let v;do{v=ri(a,b);}while(v===0);return v;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?`${n}`:`${n}/${d}`;};
const m=n=>n<0?`−${-n}`:`${n}`;                 // number with a real minus
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;            // signed term
const eq=s=>`<span class="eq">${s}</span>`;
const sq='<sup>2</sup>';
function poly(a,b,c){
  let s=(a===1?'':a===-1?'−':m(a))+'x'+sq;
  if(b)s+=` ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}x`;
  if(c)s+=` ${sg(c)}`;
  return s;
}
function mc(correct,cands,fmt){
  fmt=fmt||(x=>typeof x==='number'?m(x):x);
  const c=String(fmt(correct)),set=[];
  for(const x of cands){const s=String(fmt(x));if(s!==c&&!set.includes(s))set.push(s);}
  let k=1;
  while(set.length<3&&typeof correct==='number'&&k<50){const s=String(fmt(correct+k));if(s!==c&&!set.includes(s))set.push(s);k=k>0?-k:-k+1;}
  const ch=shuffle([c,...shuffle(set).slice(0,3)]);
  return {choices:ch,answer:ch.indexOf(c)};
}
const money=v=>'$'+(Number.isInteger(v)?v:v.toFixed(2));

const POOL=[];
function add(sec,lvl,tier,topic,fn){POOL.push({sec,lvl,tier,topic,fn});}

/* ---------- Algebra ---------- */
add('alg',1,0,'lin1',()=>{const a=ri(2,9),x=ri(2,12),b=ri(1,20),c=a*x+b;
  return {q:`If ${a}x + ${b} = ${c}, what is the value of x?`,...mc(x,[x+1,x-1,c-b,x+2]),
    expl:`Вычитаем ${b} из обеих частей: ${a}x = ${c-b}. Делим на ${a}: x = ${x}.`};});
add('alg',1,0,'linmodel',()=>{const fee=ri(2,9)*5;let rate;do{rate=ri(2,9)*5;}while(rate===fee);
  const ctx=pick([['A gym charges a one-time sign-up fee of','per month','months'],['A bike shop charges a flat rental fee of','per hour','hours'],['A plumber charges a service fee of','per hour of work','hours']]);
  return {q:`${ctx[0]} $${fee} plus $${rate} ${ctx[1]}. Which equation gives the total cost C, in dollars, for m ${ctx[2]}?`,
    ...mc(`C = ${rate}m + ${fee}`,[`C = ${fee}m + ${rate}`,`C = ${fee+rate}m`,`C = ${rate}(m + ${fee})`]),
    expl:`Разовая плата $${fee} — это константа, а $${rate} умножается на количество m. Получаем C = ${rate}m + ${fee}.`};});
add('alg',1,0,'slope',()=>{const x1=ri(-5,3),y1=ri(-6,6),dx=ri(1,4),k=nz(-4,4),x2=x1+dx,y2=y1+k*dx;
  return {q:`A line in the xy-plane passes through the points (${m(x1)}, ${m(y1)}) and (${m(x2)}, ${m(y2)}). What is the slope of the line?`,answer:k,
    expl:`Наклон = (y₂ − y₁)/(x₂ − x₁) = (${m(y2)} − (${m(y1)}))/(${m(x2)} − (${m(x1)})) = ${m(k*dx)}/${dx} = ${m(k)}.`};});

add('alg',2,0,'systems',()=>{const x=ri(1,9),y=ri(1,9),a=ri(2,5),b=ri(2,5);
  return {q:`${eq(`${a}x + y = ${a*x+y}`)}${eq(`x + ${b}y = ${x+b*y}`)}The solution to the given system of equations is (x, y). What is the value of x + y?`,answer:x+y,
    expl:`Из первого уравнения y = ${a*x+y} − ${a}x. Подставляем во второе и получаем x = ${x}, затем y = ${y}. Сумма: ${x+y}.`};});
add('alg',2,0,'lin1',()=>{const a=ri(2,6),x=ri(2,9),b=ri(1,15),k=pick([2,3]),n=ri(1,9),c=a*x+b,ans=k*a*x-n;
  return {q:`If ${a}x + ${b} = ${c}, what is the value of ${k*a}x − ${n}?`,...mc(ans,[a*x-n,x,k*a*x+n,k*c-n]),
    expl:`Из уравнения ${a}x = ${c-b}. Тогда ${k*a}x = ${k} · ${c-b} = ${k*(c-b)}, и ${k*a}x − ${n} = ${ans}. Находить сам x не обязательно.`};});
add('alg',2,0,'ineq',()=>{const p=ri(3,12),f=ri(5,20),n=ri(4,15),r=ri(1,p-1),B=f+p*n+r;const who=pick(['Mia','Daniel','Aisha','Leo']);

    expl:`Неравенство: ${f} + ${p}t ≤ ${B}, то есть ${p}t ≤ ${B-f}, t ≤ ${((B-f)/p).toFixed(2)}. Билетов целое число, поэтому максимум ${n}.`};});
add('alg',2,0,'slope',()=>{const k=nz(-3,3),b=ri(-8,8),x1=ri(1,4),x2=x1+ri(1,3);
  return {q:`A line passes through the points (${x1}, ${m(k*x1+b)}) and (${x2}, ${m(k*x2+b)}) and crosses the y-axis at the point (0, b). What is the value of b?`,answer:b,
    expl:`Наклон = (${m(k*x2+b)} − (${m(k*x1+b)}))/(${x2} − ${x1}) = ${m(k)}. Подставляем точку: ${m(k*x1+b)} = ${m(k)} · ${x1} + b, откуда b = ${m(b)}.`};});

add('alg',3,0,'systems',()=>{const a=ri(2,5),b=ri(2,6),k=pick([2,3,4]),c=ri(1,9),d=k*c+ri(1,5);
  return {q:`${eq(`${a}x + ${b}y = ${c}`)}${eq(`${k*a}x + py = ${d}`)}In the given system of equations, p is a constant. If the system has no solution, what is the value of p?`,answer:k*b,
    expl:`Решений нет, когда прямые параллельны: коэффициенты при x и y пропорциональны, а свободные члены — нет. ${k*a}/${a} = ${k}, значит p = ${k} · ${b} = ${k*b} (при этом ${d} ≠ ${k} · ${c}).`};});
add('alg',3,0,'lin1',()=>{const a=ri(2,6),p=ri(2,7),q=ri(1,9);
  return {q:`${eq(`k(x + ${p}) − ${q} = ${a}x + c`)}In the given equation, k and c are constants. If the equation has infinitely many solutions, what is the value of c?`,answer:a*p-q,
    expl:`Бесконечно много решений — обе части совпадают тождественно. Слева kx + ${p}k − ${q}. Значит k = ${a}, а c = ${p} · ${a} − ${q} = ${a*p-q}.`};});
add('alg',3,0,'systems',()=>{const A=ri(8,15),C=A-ri(2,5),na=ri(20,60),nc=ri(20,60),n=na+nc,R=A*na+C*nc;
  return {q:`A theater sold ${n} tickets for a show. Adult tickets cost $${A} each and student tickets cost $${C} each. The total revenue from ticket sales was $${R}. How many adult tickets were sold?`,answer:na,
    expl:`Система: a + s = ${n} и ${A}a + ${C}s = ${R}. Подставляем s = ${n} − a: ${A}a + ${C}(${n} − a) = ${R}, откуда ${A-C}a = ${R-C*n}, a = ${na}.`};});

          :{q:`If (x<sup>${a}</sup>)<sup>${b}</sup> = x<sup>n</sup> for all values of x, what is the value of n?`,answer:a*b,rule:1,expl:`При возведении степени в степень показатели перемножаются: ${a} · ${b} = ${a*b}.`};});

add('psda',1,0,'stats',()=>{const mean=ri(10,40);const d=[ri(-8,8),ri(-8,8),ri(-8,8),ri(-8,8)];d.push(-d.reduce((s,v)=>s+v,0));const v=shuffle(d.map(x=>mean+x));

add('psda',2,0,'percent',()=>{const a=pick([20,40,60,80,120,200,240,300]),p=pick([5,10,15,20,25,30,40,60]),b=a+a*p/100;

add('psda',2,0,'ratio',()=>{let a,b;do{a=ri(2,5);b=ri(2,7);}while(gcd(a,b)!==1);const k=ri(4,15);

add('psda',3,0,'percent',()=>{const p=pick([10,20,25,30,40,50]),q=pick([10,20,25,30,40,50]),ans=100+p-q-p*q/100,f=x=>(+x.toFixed(1))+'%';

add('psda',3,0,'stats',()=>{const n=ri(4,8),mean=ri(10,30),dl=nz(-3,4),x=(n+1)*(mean+dl)-n*mean;

add('psda',3,0,'stats',()=>{const [a,b]=pick([[1,2],[2,3],[1,3],[3,2],[1,4],[2,1]]),g=ri(4,8),t=nz(-3,3),m1=ri(65,82),m2=m1+(a+b)*t,ans=m1+b*t;

function generate(sec,lvl,tier){
  let pool=[];

const fmtTime=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function wpick(ws){let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i;}return ws.length-1;}

/* shared question markup */
function qHTML(p,a,locked){
  let h=`<div class="q">${p.q}</div>`;
  if(p.choices)h+=`<div class="opts">${p.choices.map((c,i)=>{let cls='opt';if(locked){if(i===p.answer)cls+=' ok';else if(i===a)cls+=' no';}
    return `<button class="${cls}" data-i="${i}" aria-pressed="${!locked&&a===i}" ${locked?'disabled':''}><i>${'ABCD'[i]}</i><span>${c}</span></button>`;}).join('')}</div>`;
  else h+=`<label class="grid-in"><span>Впиши ответ числом</span><input class="gi" inputmode="text" autocomplete="off" placeholder="Например, 12" value="${a==null?'':String(a).replace(/"/g,'')}" ${locked?'disabled':''}></label>`;
  return h;
}
const answered=(p,a)=>p.choices?a!=null:(a!=null&&String(a).trim()!=='');
function isRight(p,a){
  if(!answered(p,a))return false;
  if(p.choices)return a===p.answer;
  const v=Number(String(a).trim().replace('−','-').replace(',','.'));
  return Number.isFinite(v)&&Math.abs(v-p.answer)<1e-9;
}
const rightText=p=>p.choices?'ABCD'[p.answer]+') '+p.choices[p.answer]:m(p.answer);
const bookLink=p=>`<button class="btn ghost sm" data-topic="${p.topic}" data-rule="${p.rule}">Открыть правило в учебнике</button>`;

function paintTimer(){

function next(){
  const T0=TESTS[pref.test],sec=pref.sec==='all'?Object.keys(T0.w)[wpick(Object.values(T0.w))]:pref.sec,lvl=pref.lvl||wpick(T0.lv)+1;

/* ---------- timed test ---------- */
let T=null,tTick=null;
function domCounts(w,n){const ks=Object.keys(w),raw=ks.map(k=>w[k]*n),fl=raw.map(Math.floor);let rest=n-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(o=>fl[o[1]]++);
  return Object.fromEntries(ks.map((k,i)=>[k,fl[i]]));}
function buildModule(tk,variant){
  const t=TESTS[tk];let lv=t.lv.slice();
  if(variant==='hard')lv=[lv[0]*.4,lv[1],lv[2]*2.2];
  if(variant==='easy')lv=[lv[0]*1.9,lv[1],lv[2]*.3];
  const c=domCounts(t.w,NQ),qs=[];
  for(const s in c)for(let i=0;i<c[s];i++)qs.push(generate(s,wpick(lv)+1,t.tier));
  return shuffle(qs).sort((a,b)=>a.lvl-b.lvl);
}
function startTest(mode){
  T={test:pref.test,mode,mod:0,mods:[buildModule(pref.test,'base')],ans:[[]],flag:[[]],i:0,used:[],path:null,phase:'run',pal:false};
  startClock();renderTest();
}
function startClock(){T.end=Date.now()+MOD_MIN*60000;T.t0=Date.now();clearInterval(tTick);tTick=setInterval(paintClock,1000);}
function paintClock(){
  if(!T||T.phase!=='run'){clearInterval(tTick);return;}
  const left=Math.max(0,Math.round((T.end-Date.now())/1000)),el=$('tClock');
  if(el){el.textContent=fmtTime(left);el.className='tm '+(left<=60?'over':left<=300?'warn':'ok');}
  if(left<=0)endModule();
}
function endModule(){
  clearInterval(tTick);T.used[T.mod]=Math.min(MOD_MIN*60,Math.round((Date.now()-T.t0)/1000));
  if(T.mode==='full'&&T.mod===0){
    const c=T.mods[0].filter((p,i)=>isRight(p,T.ans[0][i])).length;
    T.path=c/NQ>=.6?'hard':'easy';T.mods.push(buildModule(T.test,T.path));T.ans.push([]);T.flag.push([]);T.phase='break';
  }else finishTest();
  if(view==='test')renderTest();
}
function finishTest(){
  const t=TESTS[T.test],W={1:1,2:1.25,3:1.5};let got=0,all=0,c=0,n=0;const dom={alg:[0,0],adv:[0,0],psda:[0,0],geo:[0,0]};
  T.mods.forEach((qs,mi)=>qs.forEach((p,i)=>{const ok=isRight(p,T.ans[mi][i]);all+=W[p.lvl];n++;dom[p.sec][1]++;if(ok){got+=W[p.lvl];c++;dom[p.sec][0]++;}}));
  let f=got/all;if(T.path==='easy')f=Math.min(f,.74);
  const score=Math.round((t.scale[0]+(t.scale[1]-t.scale[0])*f)/10)*10;
  T.res={c,n,dom,score,time:T.used.reduce((a,b)=>a+b,0)};T.phase='done';
  hist.unshift({d:new Date().toLocaleDateString('ru-RU'),test:t.name,mode:T.mode,c,n,score});hist=hist.slice(0,10);store('satmath-hist',hist);
}
function renderTest(){
  const el=$('v-test'),t=TESTS[pref.test];
  if(!T||T.phase==='idle'){
    el.innerHTML=`<div class="card"><h2>Тест на время: ${t.name} Math</h2>
      <p>Как на настоящем экзамене: модуль из ${NQ} вопросов на ${MOD_MIN} минут, в среднем ${fmtTime(t.avg)} на вопрос. Можно возвращаться к вопросам и отмечать их для проверки. Второй модуль подбирается по результату первого: решил хорошо — он будет сложнее.</p>
      <p class="muted">Desmos доступен на всех вопросах. После теста — результат, оценка балла и разбор каждого задания.</p>
      <button class="btn" data-start="full">Полный тест: 2 модуля, ${MOD_MIN*2} минут</button>
      <button class="btn ghost" data-start="one">Один модуль: ${NQ} вопроса, ${MOD_MIN} минут</button></div>
      <div class="card"><h3>Прошлые результаты</h3><div>${hist.length?hist.map(h=>`<div class="hist"><span>${h.d} · ${h.test} · ${h.mode==='full'?'полный':'1 модуль'}</span><b>${h.c}/${h.n} · ≈${h.score}</b></div>`).join(''):'<p class="muted">Здесь появятся результаты пройденных тестов.</p>'}</div></div>`;
    return;
  }
  if(T.phase==='break'){
    el.innerHTML=`<div class="card"><h2>Модуль 1 завершён</h2><p>Ответы сохранены. Второй модуль подобран по результату первого. Таймер запустится, когда нажмёшь кнопку.</p><button class="btn" data-next-mod>Начать модуль 2</button></div>`;return;
  }
  if(T.phase==='done'){renderResult(el);return;}
  const qs=T.mods[T.mod],p=qs[T.i],a=T.ans[T.mod][T.i],fl=T.flag[T.mod],nAns=qs.filter((q,i)=>answered(q,T.ans[T.mod][i])).length;
  el.innerHTML=`<div class="card">
    <div class="thead"><b>${T.mode==='full'?`Модуль ${T.mod+1} из 2 · `:''}Вопрос ${T.i+1} из ${NQ}</b><div class="metaR"><button class="mini" data-calc>Desmos</button><span class="tm ok" id="tClock">${fmtTime(Math.max(0,Math.round((T.end-Date.now())/1000)))}</span></div></div>
    <div class="qwrap" id="tQ">${qHTML(p,a,false)}</div>
    <div class="btnrow"><button class="btn ghost" data-nav="-1" ${T.i===0?'disabled':''}>Назад</button><button class="btn ghost" data-flag>${fl[T.i]?'Снять отметку':'Отметить'}</button><button class="btn" data-nav="1" ${T.i===NQ-1?'disabled':''}>Далее</button></div>
    <button class="link" data-pal>${T.pal?'Скрыть список вопросов':`Все вопросы · отвечено ${nAns} из ${NQ}`}</button>
    ${T.pal?`<div class="pal">${qs.map((q,i)=>`<button data-go="${i}" class="${answered(q,T.ans[T.mod][i])?'ans':''} ${fl[i]?'flag':''} ${i===T.i?'cur':''}">${i+1}</button>`).join('')}</div><p class="muted">Закрашены отвеченные, с жёлтой полоской — отмеченные для проверки.</p>`:''}
    <button class="btn ghost" data-end>Завершить модуль</button></div>`;
  paintClock();
}
function renderResult(el){
  const r=T.res,t=TESTS[T.test];let k=0;
  el.innerHTML=`<div class="card"><h3>${t.name} Math · ${T.mode==='full'?'полный тест':'один модуль'}</h3>
    <div class="score">≈ ${r.score} <small>из ${t.scale[1]}</small></div>
    <p>Верно ${r.c} из ${r.n} · время ${fmtTime(r.time)}${T.path?` · второй модуль был ${T.path==='hard'?'сложнее':'легче'}`:''}</p>
    <p class="muted">Балл приблизительный: настоящая шкала College Board учитывает сложность каждого вопроса по закрытой формуле.</p>
    <div class="rows">${Object.keys(SEC_NAME).map(s=>{const [a,b]=r.dom[s];return b?`<div class="row"><span>${SEC_NAME[s]}</span><span>${a} из ${b}</span><div class="bar"><div style="width:${a/b*100}%"></div></div></div>`:'';}).join('')}</div>
    <div class="btnrow"><button class="btn ghost" data-reset>Новый тест</button><button class="btn" data-practice>К тренировке</button></div></div>
    <h3>Разбор заданий</h3>
    ${T.mods.map((qs,mi)=>qs.map((p,i)=>{k++;const a=T.ans[mi][i],has=answered(p,a),ok=isRight(p,a);
      return `<details><summary><span>№${k} · ${SEC_NAME[p.sec]} <small>· ${LVL_NAME[p.lvl]}</small></span><span class="st ${ok?'ok':has?'no':'skip'}">${ok?'верно':has?'ошибка':'пропуск'}</span></summary>
        <div class="in">${qHTML(p,a,true)}<div class="fb ${ok?'good':'bad'}"><b>${ok?'Верно':'Правильный ответ: '+rightText(p)}</b><p>${p.expl}</p>${bookLink(p)}</div></div></details>`;}).join('')).join('')}`;
}
$('v-test').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.start)startTest(d.start);
  else if('nextMod' in d){T.mod=1;T.i=0;T.pal=false;T.phase='run';startClock();renderTest();}
  else if(d.nav){T.i=Math.max(0,Math.min(NQ-1,T.i+ +d.nav));renderTest();}
  else if(d.go){T.i=+d.go;renderTest();}
  else if('flag' in d){T.flag[T.mod][T.i]=!T.flag[T.mod][T.i];renderTest();}
  else if('pal' in d){T.pal=!T.pal;renderTest();}
  else if('end' in d){const left=T.mods[T.mod].filter((q,i)=>!answered(q,T.ans[T.mod][i])).length;
    ask(left?`Без ответа осталось вопросов: ${left}. Завершить модуль? Вернуться к нему будет нельзя.`:'Завершить модуль? Вернуться к нему будет нельзя.','Завершить',endModule);}
  else if('reset' in d){T=null;renderTest();}
  else if('practice' in d){show('practice');}
  else if(b.classList.contains('opt')&&T&&T.phase==='run'){T.ans[T.mod][T.i]=+d.i;$('tQ').querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));}
});
$('v-test').addEventListener('input',e=>{if(e.target.classList.contains('gi')&&T&&T.phase==='run')T.ans[T.mod][T.i]=e.target.value;});

  $('v-settings').innerHTML=`<div class="group"><h3>Какой тест готовишь</h3>
    ${Object.keys(TESTS).map(k=>{const t=TESTS[k];return `<button class="pick" data-test="${k}" aria-pressed="${pref.test===k}"><b>${t.name} <span>· ${t.who} · шкала ${t.scale[0]}–${t.scale[1]}</span></b><span>${t.note}</span><span>${pct(t.w)}</span></button>`;}).join('')}</div>
    <p class="muted">От выбора зависят сложность и набор тем в тренировке, состав модулей в тесте на время и шкала баллов. Формат у всех четырёх одинаковый: 2 модуля по ${NQ} вопроса, ${MOD_MIN} минут на модуль.</p>
    <div class="card"><h3>Статистика</h3><p class="muted">Счётчики тренировки и история тестов хранятся на этом устройстве.</p><button class="btn ghost" data-wipe>Сбросить статистику</button></div>`;
}
$('v-settings').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.test){pref.test=b.dataset.test;save();renderFilters();renderSettings();next();if(T&&T.phase!=='run'&&T.phase!=='break')T=null;}
  else if('wipe' in b.dataset)ask('Сбросить счётчики тренировки и историю тестов?','Сбросить',()=>{stats=blank();hist=[];save();store('satmath-hist',hist);renderStats();});
});

try{const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light';}}catch(e){}
renderFilters();renderStats();renderBook();next();
</script>
</body>
